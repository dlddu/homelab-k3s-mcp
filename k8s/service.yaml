apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp
  namespace: homelab-k3s-mcp
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # 메트릭 리스너(prd-metrics AC5). 인그레스는 위 `http` 만 가리킨다 — 이 포트는 클러스터
    # 안(스크레이퍼 · e2e 포트포워드)에서만 닿는다.
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
