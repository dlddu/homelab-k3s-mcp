apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp
  namespace: homelab-k3s-mcp
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp
      app.kubernetes.io/component: server
  template:
    metadata:
      # 📡 이벤트 기록의 수집 경로는 이 라벨이다(prd-event-log AC5 — 「수집 경로는 배포
      # 구성으로 정한다」의 실체). 서버는 레코드를 stdout 한 줄(`msg="tool call"`)로만 내고,
      # 보존은 클러스터의 Grafana Alloy(`alloy` ns, `loki.source.kubernetes "pod_logs"`)가
      # 전 파드 stdout 을 긷어 Grafana Cloud Loki 로 보내는 것으로 성립한다. Alloy 는
      # `app.kubernetes.io/name` 을 `app` 라벨로, 컨테이너 이름을 `container` 라벨로 옮기므로
      # 파드가 교체돼도 `{namespace="homelab-k3s-mcp", app="homelab-k3s-mcp", container="server"}`
      # 한 셀렉터로 이전 구간까지 조회된다 — 이 이름들을 바꾸면 그 순간 조회 셀렉터가 끊긴다.
      # 서버가 수집기와 연결을 갖지 않는 것이 AC5 의 fail-open 이 구조적인 이유다: 수집기가
      # 없거나 닿지 않아도 기동·도구·stdout 은 영향받을 경로 자체가 없다. 서버 안에 Loki push
      # sink 를 두지 않는 것도 같은 이유에 더해, Alloy 가 같은 줄을 이미 긷고 있어 두 번 실리면
      # AC1 「호출당 한 레코드」가 질의 층에서 깨지기 때문이다.
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab
    spec:
      serviceAccountName: homelab-k3s-mcp
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # ⚙️ 운영 값은 **deploy 브랜치**의 이 줄이다. docker-build-push.yaml 의 `pin`
          # job 이 main 푸시마다 그 커밋 SHA 로 이 줄을 고친 커밋을 deploy 로 발행하고,
          # Flux 는 deploy 를 추적한다. main 에 남은 값은 deploy 방식 전환 직전의 마지막
          # 고정값일 뿐 운영과 무관하다. 손으로 고칠 일은 없다(롤백은 main 에 revert PR).
          # 불변 태그라 imagePullPolicy 는 기본값(IfNotPresent)이 그대로 옳다.
          image: ghcr.io/dlddu/homelab-k3s-mcp:dc86afb92bc6a06c3c6f3912e9e38d07388ebd5c
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # Base URL of the session-platform control plane for the session_*
            # tools. Cluster-internal and not a credential, so it is a plain env
            # value rather than a Secret.
            - name: SESSION_PLATFORM_ENDPOINT
              value: http://control-plane.session-platform.svc.cluster.local
            # github_commit_status_create 가 쓸 수 있는 context 네임스페이스
            # (prd-github-commit-status AC4). 자격증명이 아니라 정책이라 Secret 이
            # 아닌 평문 env 이고, 여기 있는 값이 운영의 단일 출처다 —
            # homelab-k3s-mcp-github-app Secret 에 같은 키가 있어도 env 가 이긴다.
            # 비우거나 지우면 모든 호출이 거부된다(fail-closed).
            - name: GITHUB_COMMIT_STATUS_CONTEXT_PREFIXES
              value: review/
          envFrom:
            - configMapRef:
                name: homelab-k3s-mcp-oauth
            - secretRef:
                name: homelab-k3s-mcp-github-app
            # AWS_CONFIG_S3_BUCKET, AWS_CONFIG_S3_KEY, AWS_CONFIG_ROLE_ARN and
            # the optional AWS_CONFIG_* overrides for the aws_config_get tool.
            - secretRef:
                name: homelab-k3s-mcp-aws-config
            # GRAFANA_ISSUER_TOKEN, GRAFANA_READ_POLICY_ID, GRAFANA_REGION,
            # GRAFANA_METRICS_URL/USER, GRAFANA_LOGS_URL/USER and the optional
            # GRAFANA_API_URL override for the grafana_token tool.
            - secretRef:
                name: homelab-k3s-mcp-grafana
            # OPENSEARCH_ENDPOINT, OPENSEARCH_ROLE_ARN, OPENSEARCH_REGION and
            # the optional OPENSEARCH_* overrides for the opensearch_* tools.
            - secretRef:
                name: homelab-k3s-mcp-opensearch
            # GATEKEEPER_BASE_URL and GATEKEEPER_API_KEY for the approval gate,
            # plus the optional GATEKEEPER_USER_ID (push notifications) and the
            # timeout/poll overrides. Optional because an unconfigured gate
            # already fails closed — it refuses gated calls instead of taking
            # the whole endpoint down — so a missing secret degrades one
            # boundary rather than crashlooping, and the flux-cd-apps side that
            # creates it can land in either order.
            - secretRef:
                name: homelab-k3s-mcp-gatekeeper
                optional: true
            # MCP_API_KEYS: comma-separated static bearer keys that let
            # non-interactive clients authenticate to /mcp without the OAuth
            # flow. Optional so OAuth-only (and MCP_AUTH_DISABLED) deployments
            # need not provide the secret; when used it is created out-of-band
            # like the other credential secrets and never committed.
            - secretRef:
                name: homelab-k3s-mcp-api-keys
                optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
