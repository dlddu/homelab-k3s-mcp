apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-k3s-mcp:workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab
# prd-resource-generic AC19 owns what goes in here: the pair set equals what the
# registered tools exercise, union the gate's own declarations. Each pair is
# granted by the PR that lands the tool exercising it, so this file grows with
# the tool surface rather than ahead of it. prd-platform-auth-safety AC3 owns the
# step after: that the deployed identity can do exactly this and no more, which
# only a SubjectAccessReview can observe.
# resource_list and resource_get address any kind by coordinate, so a kind
# outside these rules is reported as outside this server's grant
# (prd-resource-generic AC18) rather than quietly widened here.
rules:
  # resource_list / resource_get over apps workloads. watch is a dead grant:
  # nothing in the code calls Watch(), and resource_watch is unimplemented. It
  # survives only because the previous edition of AC3 transcribed it; removing it
  # is tracked in doc-tracker.md rather than folded into the PR that stopped the
  # transcription, so that a permission change lands on its own.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - patch
  # dear_baby_reset_user execs the bundled /reset-user CLI
  # inside a running backend pod. List is needed to resolve the label
  # selector to a pod name; pods/exec is the subresource the apiserver
  # gates the exec stream on. client-go's SPDY executor opens the stream
  # with POST (the `create` verb). `get` on pods/exec is the second dead grant:
  # it was kept for a WebSocket executor fallback that the code does not have —
  # internal/k8s/client.go pins remotecommand.NewSPDYExecutor. Tracked for
  # removal with `watch`.
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - get
      - create
  # resource_get with subresource=log reads container logs from a named pod.
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  # Events are read as a kind of their own now (resource_list on v1/Event with a
  # fieldSelector), which is what replaces the events half of pod_describe.
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-k3s-mcp:workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-k3s-mcp:workloads
subjects:
  - kind: ServiceAccount
    name: homelab-k3s-mcp
    namespace: homelab-k3s-mcp
