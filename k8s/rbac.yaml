# 이 서버의 ServiceAccount 는 내장 `cluster-admin` 에 바인딩된다. 전용 ClusterRole 은
# 없다 — 이 파일이 verb 를 고르던 자리였고, 그 선택을 그만두는 것이 이 개정의 내용이다.
#
# 왜 이렇게 됐는지: 이전 판에서 RBAC 는 도구 레이어 판정이 뚫려도 apiserver 가 막아 주는
# 2차 방어선이었다. `watch`·`deletecollection`·`pods/attach`·`pods/portforward`·
# `⟨kind⟩/proxy`·`secrets` 쓰기가 차례로 도구가 되면서 금지 목록이 비었고, 남은 역할은
# 종류 범위를 좁히는 것 하나였다. 그 하나까지 그만둔다.
#
# **따라서 승인 게이트가 유일한 경계다.** 게이트에 결함이 생기면 이 ServiceAccount 를
# 막는 것은 아무것도 없다 — 미설정 게이트는 fail-closed 라 그쪽은 닫혀 있지만(게이트가
# 없으면 게이트 대상 호출을 거부한다), 게이트가 있는데 **틀린** 경우는 이 파일이 더 이상
# 잡아 주지 않는다. `internal/gatekeeper` 를 고치는 PR 은 그 사실 위에서 검토한다.
#
# 바인딩 이름은 `homelab-k3s-mcp:workloads` 그대로 둔다. 이름이 더는 내용을 설명하지
# 못하지만, flux-cd-apps 의 PR 프리뷰 오버레이가 클러스터 스코프 RBAC 을 이 이름으로
# 찾아 PR 번호로 개명한다. 개명은 그 오버레이와 같은 PR 에서만 할 수 있다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-k3s-mcp:workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: homelab-k3s-mcp
    namespace: homelab-k3s-mcp
