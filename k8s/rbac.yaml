apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-k3s-mcp:workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab
rules:
  # resource_list and resource_get take the kind as an argument, so a
  # workload-shaped grant would drop most kinds into prd-resource-generic AC18's
  # "outside this server's grant". What is opened here is the read half and only
  # the read half: get and list, no write verb and no watch (resource_watch is
  # not implemented, and an unexercised grant is attack surface with no user).
  #
  # This includes secrets, which doc-tracker.md carries as an accepted risk
  # ("방어층 축소") on two stated preconditions — dispatcher-level enforcement
  # (prd-approval-gate AC1) and fail-closed refusal (AC5) — both of which landed
  # in PR #73. get on a sensitive kind is refused before the apiserver is
  # touched unless a human approves it (AC16); list stays ungated because the
  # table is rendered server-side and carries no values (AC17). Write verbs on
  # secrets are deliberately still absent: the ordering constraint is gate
  # first, write grant later, and the write half of the gate has no tool yet.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs:
      - get
      - list
  # workload_restart and workload_scale are retired in the documents and survive
  # in code pending removal (doc-tracker.md 「문서 없는 실행 코드」). Their patch
  # goes when they do; resource_patch is what replaces it.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - patch
  # dear_baby_reset_user execs the bundled /reset-user CLI inside a running
  # backend pod. client-go's SPDY executor opens the stream with POST (the
  # `create` verb); `get` is retained so a WebSocket executor fallback keeps
  # working without an RBAC change.
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - get
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-k3s-mcp:workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-k3s-mcp:workloads
subjects:
  - kind: ServiceAccount
    name: homelab-k3s-mcp
    namespace: homelab-k3s-mcp
