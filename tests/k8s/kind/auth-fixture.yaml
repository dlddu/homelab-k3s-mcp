# Auth-enabled deployment variant for the platform-auth-safety AC1/AC7 e2e.
#
# Kubernetes is the one integration that absence alone cannot switch off -- it
# reads an in-cluster ServiceAccount, not a secret -- so MCP_K8S_DISABLED below
# closes that gap explicitly.
#
# Do not attach credential secrets or credential env here — wire them into the
# primary kind deployment instead.
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-k3s-mcp-auth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-auth
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-auth
  namespace: homelab-k3s-mcp-auth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-auth
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-auth
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-auth
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # A throwaway CI credential; must match API_KEY in
            # tests/integration/_auth_variant.py.
            - name: MCP_API_KEYS
              value: ci-e2e-key
            # Turning this off is not a convenience: main.go's buildK8sService
            # returns k8s.NewUnavailable("kubernetes integration is disabled")
            # for it, and _auth_variant.py::K8S_REFUSAL pins that text.
            - name: MCP_K8S_DISABLED
              value: "1"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp-auth
  namespace: homelab-k3s-mcp-auth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-auth
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-k3s-mcp-auth
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
