# resource_* 도구군 전용 픽스처 — 무엇을 담고 어떻게 자라는지는
# `docs/test-resource-generic.md` 의 「픽스처」 절이 정한다.
#
# 객체가 하나뿐이면 셀렉터를 붙여도 1 → 1 이라 줄었다는 것이 관측되지 않고, 셀렉터를 통째로
# 무시하는 구현도 그대로 통과한다. 그래서 종류마다 둘씩 둔다.
#
# CRD 인스턴스는 여기 두지 않고 `resource-generic-samples.yaml` 에 있다 — 갈라 둔 이유
# (`kubectl apply` 가 종류를 해석하는 시점)는 위 「픽스처」 절에 있다.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourcegenericsamples.homelab-k3s-mcp.test
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  group: homelab-k3s-mcp.test
  scope: Namespaced
  names:
    kind: ResourceGenericSample
    listKind: ResourceGenericSampleList
    plural: resourcegenericsamples
    singular: resourcegenericsample
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                note:
                  type: string
      # 프린터 컬럼을 하나 준다. 이 종류의 목록도 apiserver 의 Table 로 오는지를 보는 것이
      # 시나리오의 「일곱 종류 모두 목록 반환」이고, 기본 컬럼(NAME/AGE)만 있으면 CRD 가
      # 자기 컬럼을 실어 보낼 수 있는지가 이 경로에서 관측되지 않는다.
      additionalPrinterColumns:
        - name: Note
          type: string
          jsonPath: .spec.note
---
apiVersion: v1
kind: Service
metadata:
  name: resource-generic-selected
  namespace: workload-test
  labels:
    app.kubernetes.io/name: resource-generic-selected
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  # 셀렉터도 엔드포인트도 두지 않는다. 이 Service 는 트래픽을 받으려고 있는 것이 아니라
  # `v1/Service` 좌표로 조회될 대상으로 있는 것이다.
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: resource-generic-other
  namespace: workload-test
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-generic-selected
  namespace: workload-test
  labels:
    app.kubernetes.io/name: resource-generic-selected
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
data:
  note: selected
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-generic-other
  namespace: workload-test
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
data:
  note: other
---
# kind 클러스터에는 인그레스 컨트롤러가 없다. 그래도 되는 이유는 이 시나리오가 재는 것이
# 「이 종류를 좌표로 목록 조회할 수 있는가」이지 라우팅이 아니기 때문이다 — 백엔드가
# 실제로 서비스되는지는 apiserver 가 묻지 않는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resource-generic-selected
  namespace: workload-test
  labels:
    app.kubernetes.io/name: resource-generic-selected
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  rules:
    - host: selected.resource-generic.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resource-generic-selected
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resource-generic-other
  namespace: workload-test
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  rules:
    - host: other.resource-generic.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resource-generic-other
                port:
                  number: 80
---
# 다중 컨테이너 파드(시나리오 5). 두 가지를 한 파드로 세운다.
#
# ⑴ **컨테이너가 둘이어야** `container` 누락 거부가 관측된다 — apiserver 는 파드에 컨테이너가
#    하나뿐이면 그냥 그것을 읽어 주므로, 단일 컨테이너 파드로는 「후보 이름이 제시됨」을 잴
#    대상 자체가 없다. `tests/k8s/kind/` 의 기존 네 워크로드는 전부 단일 컨테이너였다.
# ⑵ **로그를 실제로 내는 컨테이너**가 있어야 `tailLines` 절단이 관측된다. 기준선
#    `workload-fixture` 는 `pause` 라 한 줄도 내지 않아, 그것으로 재면 「줄었다」가 0 → 0 이 된다.
#
# `chatty` 는 정해진 줄 수를 찍고 그대로 산다 — 찍는 동안만 사는 컨테이너를 두면 Deployment 의
# `restartPolicy: Always` 가 계속 재시작시켜 파드가 흔들리고, 줄 수도 재시작마다 달라진다.
#
# ⚠️ 셸 인자에 `$(` 를 쓰지 않는다(`$((i+1))` · `$(seq …)` 포함). kubelet 이 command/args 의
# `$(VAR)` 를 **컨테이너가 뜨기 전에** 먼저 확장하므로, 산술·명령치환이 그 경로를 지나며
# 조용히 모양이 바뀔 수 있다. `seq | sed` 파이프는 그 문법을 전혀 쓰지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-generic-multi
  namespace: workload-test
  labels:
    app.kubernetes.io/name: resource-generic-multi
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-generic-multi
  template:
    metadata:
      labels:
        app: resource-generic-multi
    spec:
      containers:
        - name: chatty
          image: busybox:1.36
          command:
            - sh
            - -c
            - "seq 1 40 | sed 's/^/chatty line /'; exec sleep 2147483647"
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
        - name: quiet
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
---
# 목록 절단(시나리오 3)을 만드는 ConfigMap 120개. 기본 페이지가 100 이므로 120 이면 1회차가
# 잘리고 2회차가 나머지 20건을 돌려준다 — 두 페이지가 다 관측되는 가장 작은 모집단이다.
#
# 전용 레이블 `homelab-k3s-mcp.test/paging` 을 다는 이유는 모집단을 **정확히 120** 으로
# 고정하기 위해서다. 이 네임스페이스에는 위의 `resource-generic-selected`·`-other` 와
# apiserver 가 자동으로 넣는 `kube-root-ca.crt` 가 이미 있어, 셀렉터 없이 세면 모집단이 123 이
# 되고 시나리오가 요구하는 「나머지 20건」이 성립하지 않는다. 자동 생성 객체에 기대어 수를
# 맞추는 길(119개 + kube-root-ca.crt)은 클러스터 버전과 컨트롤러 타이밍에 의존하므로 택하지
# 않았다.
