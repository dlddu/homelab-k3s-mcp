apiVersion: v1
kind: Namespace
metadata:
  # 등재: docs/e2e-mocking-policy.md
  # mock-exception: UPS — 실 상류가 GitHub 공개 SaaS 라 kind 안에서 구동할 수 없다.
  name: github-mock
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-mock-script
  namespace: github-mock
data:
  server.py: |
    import json
    import re
    import sys
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    INSTALLATION_TOKEN_RE = re.compile(
        r"^/app/installations/(?P<id>\d+)/access_tokens$"
    )
    INSTALLATION_RE = re.compile(r"^/app/installations/(?P<id>\d+)$")
    COMMIT_STATUS_RE = re.compile(
        r"^/repos/(?P<owner>[^/]+)/(?P<repo>[^/]+)/statuses/(?P<sha>[0-9a-fA-F]{40})$"
    )

    INSTALLATION_ACCOUNT_LOGIN = "dlddu"
    UNPROCESSABLE_SHA = "f" * 40

    DEFAULT_PERMISSIONS = {"contents": "read", "metadata": "read"}

    # All three knobs default to off so every other e2e sees the stock GitHub shapes.
    DEFAULT_CONFIG = {
        "installation_status": 200,
        "installation_permissions": None,
        "mint_extra_permissions": None,
    }

    STATE = threading.Lock()
    REQUESTS = []
    CONFIG = dict(DEFAULT_CONFIG)


    def record(method, path, headers, body):
        with STATE:
            REQUESTS.append(
                {
                    "method": method,
                    "path": path,
                    "authorization": headers.get("Authorization", ""),
                    "body": body,
                }
            )


    def config():
        with STATE:
            return dict(CONFIG)


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            sys.stdout.write("github-mock " + (fmt % args) + "\n")
            sys.stdout.flush()

        def _read_body(self):
            length = int(self.headers.get("Content-Length", "0") or "0")
            return self.rfile.read(length).decode() if length else ""

        def do_GET(self):
            if self.path == "/healthz":
                self._json(200, {"status": "ok"})
                return
            if self.path == "/_admin/requests":
                with STATE:
                    self._json(200, {"requests": list(REQUESTS)})
                return
            match = INSTALLATION_RE.match(self.path)
            if match:
                record("GET", self.path, self.headers, "")
                if not self.headers.get("Authorization", "").startswith("Bearer "):
                    self._json(401, {"message": "Requires authentication"})
                    return
                status = config()["installation_status"]
                if status != 200:
                    self._json(status, {"message": "Server Error"})
                    return
                permissions = dict(DEFAULT_PERMISSIONS)
                permissions.update(config()["installation_permissions"] or {})
                self._json(
                    200,
                    {
                        "id": int(match.group("id")),
                        "account": {"login": INSTALLATION_ACCOUNT_LOGIN},
                        "permissions": permissions,
                    },
                )
                return
            self._json(404, {"message": "Not Found"})

        def do_POST(self):
            if self.path == "/_admin/config":
                raw = self._read_body()
                try:
                    payload = json.loads(raw) if raw else {}
                except json.JSONDecodeError:
                    self._json(400, {"message": "Invalid JSON"})
                    return
                # A body carries the whole config: absent keys go back to their
                # default, so POSTing {} is how a test restores the stock mock.
                with STATE:
                    CONFIG.clear()
                    CONFIG.update(DEFAULT_CONFIG)
                    CONFIG.update(payload)
                    self._json(200, dict(CONFIG))
                return

            match = COMMIT_STATUS_RE.match(self.path)
            if match:
                raw = self._read_body()
                record("POST", self.path, self.headers, raw)

                if not self.headers.get("Authorization", "").startswith("Bearer "):
                    self._json(401, {"message": "Requires authentication"})
                    return

                if self.headers.get("X-GitHub-Api-Version") != "2022-11-28":
                    self._json(400, {"message": "Missing X-GitHub-Api-Version"})
                    return

                if not (self.headers.get("Accept") or "").startswith(
                    "application/vnd.github"
                ):
                    self._json(400, {"message": "Missing Accept header"})
                    return

                try:
                    payload = json.loads(raw) if raw else {}
                except json.JSONDecodeError:
                    self._json(400, {"message": "Invalid JSON"})
                    return

                sha = match.group("sha")
                if sha.lower() == UNPROCESSABLE_SHA:
                    self._json(
                        422,
                        {
                            "message": "Validation Failed",
                            "errors": [
                                {
                                    "resource": "Status",
                                    "code": "custom",
                                    "message": f"No commit found for SHA: {sha}",
                                }
                            ],
                        },
                    )
                    return

                created = {
                    "id": 1,
                    "state": payload.get("state", ""),
                    "context": payload.get("context", ""),
                    "created_at": "2026-01-01T00:00:00Z",
                }
                if payload.get("description"):
                    created["description"] = payload["description"]
                if payload.get("target_url"):
                    created["target_url"] = payload["target_url"]
                self._json(201, created)
                return

            match = INSTALLATION_TOKEN_RE.match(self.path)
            if not match:
                self._json(404, {"message": "Not Found"})
                return

            raw = self._read_body()
            record("POST", self.path, self.headers, raw)

            auth = self.headers.get("Authorization", "")
            if not auth.startswith("Bearer "):
                self._json(401, {"message": "Requires authentication"})
                return

            if self.headers.get("X-GitHub-Api-Version") != "2022-11-28":
                self._json(400, {"message": "Missing X-GitHub-Api-Version"})
                return

            if not (self.headers.get("Accept") or "").startswith(
                "application/vnd.github"
            ):
                self._json(400, {"message": "Missing Accept header"})
                return

            try:
                payload = json.loads(raw) if raw else {}
            except json.JSONDecodeError:
                self._json(400, {"message": "Invalid JSON"})
                return

            repositories = payload.get("repositories")
            permissions = dict(payload.get("permissions") or DEFAULT_PERMISSIONS)
            permissions.update(config()["mint_extra_permissions"] or {})

            self._json(
                201,
                {
                    "token": f"ghs_mock_{match.group('id')}",
                    "expires_at": "2099-01-01T00:00:00Z",
                    "permissions": permissions,
                    "repository_selection": "selected" if repositories else "all",
                },
            )

        def do_DELETE(self):
            if self.path == "/_admin/requests":
                with STATE:
                    REQUESTS.clear()
                self._json(200, {"requests": []})
                return
            if self.path == "/installation/token":
                record("DELETE", self.path, self.headers, "")
                if not self.headers.get("Authorization", "").startswith("Bearer "):
                    self._json(401, {"message": "Requires authentication"})
                    return
                self.send_response(204)
                self.send_header("Content-Length", "0")
                self.end_headers()
                return
            self._json(404, {"message": "Not Found"})

        def _json(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mock
  namespace: github-mock
  labels:
    app.kubernetes.io/name: github-mock
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-mock
  template:
    metadata:
      labels:
        app: github-mock
    spec:
      containers:
        - name: server
          image: python:3.12-alpine
          command: ["python", "/scripts/server.py"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: github-mock-script
---
apiVersion: v1
kind: Service
metadata:
  name: github-mock
  namespace: github-mock
spec:
  selector:
    app: github-mock
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
