# Misconfigured-gate SUT variants for test-approval-gate.md#시나리오 5.
#
# Three of the scenario's eight failure paths are properties of the SUT's own
# deployment rather than of anything PocketAide does, and env and volumes are
# per deployment (the same reason approval-variant.yaml exists). They cannot be
# folded into one deployment and they cannot be produced by mutating an
# existing one mid-run: the approval-variant namespace is shared by every file
# of its group, and restarting it under them would be a cross-file race.
#
#  * unreachable  -- APPROVAL_GATE_URL points at the container's own discard
#    port, so the dial is refused immediately and deterministically. The token
#    volume is mounted so that FromEnv succeeds and the refusal really is the
#    dial.
#
# The no-url and no-token variants are two error branches of
# approvalgate.FromEnv(); the server still starts and main.go turns each into
# approvalgate.NewUnavailable(err) (main.go 「invalid approval gate config;
# gated calls will be refused」). Both refuse WITHOUT calling Describe, so no kubernetes read
# happens either -- the e2e observes that as the target object staying
# byte-identical.
#
# None of the three is registered as a PocketAide caller (ci.yml registers only
# the deployments that reach it): a refusal here must not depend on PocketAide
# answering at all.
#
# The dedicated ClusterRoleBinding exists for the same reason the other
# variants' do: authorization is per ServiceAccount.
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-k3s-mcp-gate-broken
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-broken
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-k3s-mcp
  namespace: homelab-k3s-mcp-gate-broken
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-broken
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-k3s-mcp:gate-broken-workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-broken
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: homelab-k3s-mcp
    namespace: homelab-k3s-mcp-gate-broken
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-gate-unreachable
  namespace: homelab-k3s-mcp-gate-broken
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-unreachable
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-gate-unreachable
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-gate-unreachable
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      serviceAccountName: homelab-k3s-mcp
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # 등재: docs/e2e-mocking-policy.md — 대체 검증은 auth-fixture.yaml(인증을 켠 변형)
            # mock-exception: GATE — 이 변형의 검증 대상은 게이트 미설정·불통이지 인증이 아니다. env 는 배포당이라 기본 배포의 완화를 물려받을 수 없어 여기서 다시 내린다.
            - name: MCP_AUTH_DISABLED
              value: "1"
            # 연결 실패 경로. 파드 자신의 discard 포트라 아무도 듣지 않아 dial 이 즉시 거부된다 —
            # 타임아웃을 기다리지 않으므로 이 경로만 초 단위로 결정적이다.
            - name: APPROVAL_GATE_URL
              value: http://127.0.0.1:9
            - name: APPROVAL_GATE_TIMEOUT_SECONDS
              value: "5"
            - name: APPROVAL_GATE_POLL_INTERVAL_SECONDS
              value: "1"
          volumeMounts:
            - name: pocket-aide-token
              mountPath: /var/run/secrets/pocket-aide
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: pocket-aide-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: pocket-aide
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp-gate-unreachable
  namespace: homelab-k3s-mcp-gate-broken
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-unreachable
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-unreachable
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-gate-no-url
  namespace: homelab-k3s-mcp-gate-broken
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-no-url
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-gate-no-url
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-gate-no-url
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      serviceAccountName: homelab-k3s-mcp
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # 등재: docs/e2e-mocking-policy.md — 대체 검증은 auth-fixture.yaml(인증을 켠 변형)
            # mock-exception: GATE — 이 변형의 검증 대상은 게이트 미설정·불통이지 인증이 아니다. env 는 배포당이라 기본 배포의 완화를 물려받을 수 없어 여기서 다시 내린다.
            - name: MCP_AUTH_DISABLED
              value: "1"
            # APPROVAL_GATE_URL 미설정 — FromEnv 의 「TOKEN_FILE is set but URL is not」 분기.
            # 토큰 파일은 실재하므로(아래 볼륨) 이 거부는 URL 하나의 부재에서만 나온다.
            - name: APPROVAL_GATE_TOKEN_FILE
              value: /var/run/secrets/pocket-aide/token
          volumeMounts:
            - name: pocket-aide-token
              mountPath: /var/run/secrets/pocket-aide
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: pocket-aide-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: pocket-aide
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp-gate-no-url
  namespace: homelab-k3s-mcp-gate-broken
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-no-url
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-no-url
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-gate-no-token
  namespace: homelab-k3s-mcp-gate-broken
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gate-no-token
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-gate-no-token
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-gate-no-token
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      serviceAccountName: homelab-k3s-mcp
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # 등재: docs/e2e-mocking-policy.md — 대체 검증은 auth-fixture.yaml(인증을 켠 변형)
            # mock-exception: GATE — 이 변형의 검증 대상은 게이트 미설정·불통이지 인증이 아니다. env 는 배포당이라 기본 배포의 완화를 물려받을 수 없어 여기서 다시 내린다.
            - name: MCP_AUTH_DISABLED
              value: "1"
            # 토큰 미마운트 — URL 은 살아 있는 PocketAide 를 가리키지만 pocket-aide-token 볼륨이
            # 없어 FromEnv 가 기본 경로의 토큰을 읽지 못하는 분기다. 닿을 수 있는 백엔드를 두는
            # 것이 요점이다: 거부가 연결 실패가 아니라 자격증명 부재에서 나왔다는 것이 문면으로 갈린다.
            - name: APPROVAL_GATE_URL
              value: http://pocket-aide.pocket-aide.svc.cluster.local:8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
