# 호출자로 등록되지 않은 SUT 배포 — test-pocket-aide-notification-send.md#시나리오 3
# (pocket_aide_notification_send_sc3.py) 의 「미등록 ServiceAccount 의 배포」.
#
# PocketAide 는 projected 토큰의 ServiceAccount 가 어떤 사용자의 호출자로 등록돼 있을 때만
# 외부 알림 요청을 받는다(미등록이면 401). 등록은 ci.yml 이 tests/integration/_approval_gate.py
# 의 CALLERS 표대로 하므로, 이 네임스페이스의 SA 는 그 표에 **일부러 올리지 않는다** — 등록하는 순간
# 이 배포가 존재하는 이유가 사라진다. APPROVAL_GATE_URL 과 토큰 볼륨은 정상이라 401 은 PocketAide 가
# 자기 인증 층에서 내는 응답이고 스텁이 아니다. 인증은 켜 둔다(MCP_API_KEYS, auth-fixture.yaml 의 일회용
# 키) — gate-refusal-variant.yaml 과 같은 형태라 docs/e2e-mocking-policy.md 에 GATE 항목을 더하지 않는다.
#
# 등록된 쪽(503)은 별도 배포가 필요 없다 — 등록된 primary 가 그 몫이다.
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-k3s-mcp-notify-unregistered
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-k3s-mcp
  namespace: homelab-k3s-mcp-notify-unregistered
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-k3s-mcp:notify-unregistered-workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: homelab-k3s-mcp
    namespace: homelab-k3s-mcp-notify-unregistered
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-notify-unregistered
  namespace: homelab-k3s-mcp-notify-unregistered
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      serviceAccountName: homelab-k3s-mcp
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # Same throwaway CI key as tests/k8s/kind/auth-fixture.yaml, so the
            # e2e can reuse _auth_variant.API_KEY.
            - name: MCP_API_KEYS
              value: ci-e2e-key
            - name: APPROVAL_GATE_URL
              value: http://pocket-aide.pocket-aide.svc.cluster.local:8080
          volumeMounts:
            - name: pocket-aide-token
              mountPath: /var/run/secrets/pocket-aide
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        # k8s/deployment.yaml 의 pocket-aide-token 과 같은 projected 토큰 — PocketAide 가 이
        # 네임스페이스의 SA 를 호출자로 알아보는 유일한 자격증명이다.
        - name: pocket-aide-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: pocket-aide
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp-notify-unregistered
  namespace: homelab-k3s-mcp-notify-unregistered
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-k3s-mcp-notify-unregistered
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
