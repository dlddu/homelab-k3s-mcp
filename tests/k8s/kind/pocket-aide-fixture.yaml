# 이미지는 ci.yml 이 POCKET_AIDE_SHA 커밋의 backend/cmd/server 를 빌드한 `pocket-aide:ci` 다.
# 발행 이미지(ghcr.io/dlddu/pocket-aide)가 아니라 소스에서 빌드한 것은 이 서버를
# 게이트 계약(POCKET_AIDE_SHA 핀)에 맞추기 위해서다. IdP 는 실 dex(pocket-aide-dex.yaml)다.
#
# 서비스 어카운트 호출자는 TokenReview 로 검증된다(internal/auth/serviceaccount.go). 그래서
# PocketAide 자신의 SA 가 system:auth-delegator 에 묶여야 하고, 묶이지 않으면 외부 호출 전부가
# 503 이다 — 거부가 아니라 「검증 불가」라 SUT 쪽에서는 unreachable 로 보인다.
#
# pocket-aide-trace 는 http-trace 와 같은 계열의 기록 프록시다 — 대체재가 아니라 관측면이다.
# 시나리오 2 의 검증 대상(create 요청 본문)은 PocketAide 의 기록에 남지 않는다. 프록시는 요청
# 본문과 식별자만 기록하고 Authorization 값(SUT 의 서비스 어카운트 토큰)은 로그에 두지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: pocket-aide
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pocket-aide
  namespace: pocket-aide
  labels:
    app: pocket-aide
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pocket-aide:auth-delegator
  labels:
    app: pocket-aide
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: pocket-aide
    namespace: pocket-aide
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocket-aide
  namespace: pocket-aide
  labels:
    app: pocket-aide
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
# pocket-aide 레포 k8s/deployment.yaml 의 kind 판본. Recreate 와 복제 1 은 그 파일이 SQLite
# 단일 쓰기 불변식 때문에 고정해 둔 것이라 그대로 가져왔다. SQS_QUEUE_URL 을 두지 않으므로
# PR 모니터와 APNs 발송은 꺼진 채 뜬다 — 승인 요청 생성 뒤의 푸시는 이 하네스가 보지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-aide
  namespace: pocket-aide
  labels:
    app: pocket-aide
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocket-aide
  template:
    metadata:
      labels:
        app: pocket-aide
    spec:
      serviceAccountName: pocket-aide
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocket-aide
          image: pocket-aide:ci
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/pocket-aide"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_PATH
              value: /data/pocket-aide.db
            # 셋 다 pocket-aide-dex.yaml 의 설정과 같아야 한다(issuer · 클라이언트 id = audience).
            - name: OIDC_ISSUER
              value: http://dex.dex-pocket-aide.svc.cluster.local:5556
            - name: OIDC_AUDIENCE
              value: pocket-aide-e2e
            - name: OIDC_CLIENT_ID
              value: pocket-aide-e2e
            - name: OIDC_REDIRECT_URI
              value: http://127.0.0.1/e2e-callback
            # k8s/deployment.yaml 의 pocket-aide-token 볼륨 audience 와 같아야 한다.
            - name: K8S_CALLER_AUTH
              value: "true"
            - name: K8S_TOKEN_AUDIENCE
              value: pocket-aide
            - name: K8S_TOKEN_ISSUER
              value: https://kubernetes.default.svc.cluster.local
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-aide
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-aide
  namespace: pocket-aide
  labels:
    app: pocket-aide
spec:
  type: ClusterIP
  selector:
    app: pocket-aide
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-aide-trace-script
  namespace: pocket-aide
data:
  trace_proxy.py: |
    """Recording reverse proxy in front of the PocketAide fixture.

    Two listeners in one process: :8080 forwards every request to the
    PocketAide Service verbatim, :8081 serves the recording as JSON. What is
    recorded is what the approval contract (docs/test-approval-gate.md
    시나리오 2, docs/prd-approval-gate.md AC2) makes observable and the upstream
    alone does not: the create body (externalId, context, requesterName,
    timeoutSeconds), the scheme of the Authorization header, and how many times
    each request id was polled. The credential itself never lands in the log.
    """

    import json
    import threading
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = "http://pocket-aide.pocket-aide.svc.cluster.local:8080"
    CREATE_PATH = "/api/external/approvals"
    MAX_RECORDS = 2000

    records = []
    records_lock = threading.Lock()


    def record(entry):
        with records_lock:
            records.append(entry)
            del records[:-MAX_RECORDS]


    def auth_scheme(value):
        if not value:
            return ""
        return value.split(" ", 1)[0]


    class ForwardHandler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _forward(self):
            length = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(length) if length else None
            headers = {
                k: v for k, v in self.headers.items()
                if k.lower() not in ("host", "content-length", "connection")
            }
            req = urllib.request.Request(
                UPSTREAM + self.path, data=body, headers=headers, method=self.command
            )
            try:
                with urllib.request.urlopen(req, timeout=30) as resp:
                    resp_body = resp.read()
                    status = resp.status
                    resp_headers = dict(resp.headers)
            except urllib.error.HTTPError as exc:
                resp_body = exc.read()
                status = exc.code
                resp_headers = dict(exc.headers or {})
            scheme = auth_scheme(self.headers.get("Authorization"))
            if self.command == "POST" and self.path == CREATE_PATH:
                try:
                    parsed = json.loads(body or b"{}")
                except ValueError:
                    parsed = {"unparseable": True}
                record({
                    "type": "create",
                    "path": self.path,
                    "status": status,
                    "authorization_scheme": scheme,
                    "body": parsed,
                })
            elif self.command == "GET" and self.path.startswith(CREATE_PATH + "/"):
                record({
                    "type": "poll",
                    "path": self.path,
                    "status": status,
                    "authorization_scheme": scheme,
                })
            self.send_response(status)
            for key in ("Content-Type",):
                if key in resp_headers:
                    self.send_header(key, resp_headers[key])
            self.send_header("Content-Length", str(len(resp_body)))
            self.end_headers()
            self.wfile.write(resp_body)

        do_GET = do_POST = do_PATCH = do_PUT = do_DELETE = _forward

        def log_message(self, fmt, *args):
            pass


    class RecordHandler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            with records_lock:
                snapshot = list(records)
            body = json.dumps({"records": snapshot}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            pass


    def main():
        forward = ThreadingHTTPServer(("0.0.0.0", 8080), ForwardHandler)
        admin = ThreadingHTTPServer(("0.0.0.0", 8081), RecordHandler)
        threading.Thread(target=forward.serve_forever, daemon=True).start()
        admin.serve_forever()


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-aide-trace
  namespace: pocket-aide
  labels:
    app: pocket-aide-trace
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocket-aide-trace
  template:
    metadata:
      labels:
        app: pocket-aide-trace
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: trace
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/script/trace_proxy.py"]
          ports:
            - name: forward
              containerPort: 8080
            - name: admin
              containerPort: 8081
          volumeMounts:
            - name: script
              mountPath: /script
          readinessProbe:
            httpGet:
              path: /records
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /records
              port: admin
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: script
          configMap:
            name: pocket-aide-trace-script
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-aide-trace
  namespace: pocket-aide
  labels:
    app: pocket-aide-trace
spec:
  type: ClusterIP
  selector:
    app: pocket-aide-trace
  ports:
    - name: forward
      port: 8080
      targetPort: forward
    - name: admin
      port: 8081
      targetPort: admin
