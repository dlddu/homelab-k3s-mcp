# The session-platform control plane, run for real in the kind harness.
#
# session_list reads the control plane's in-cluster REST API
# (GET /api/v1/sessions), so session-list/AC1..AC3 need one to exist. This
# deploys the REAL component rather than an upstream stand-in: the published
# image is a public GHCR package (the session-platform repo notes as much in
# k8s/deployment.yaml -- "GHCR 패키지는 공개라 imagePullSecret 은 필요 없다") and
# ships a linux/arm64 manifest, so the CI runner's kind node pulls it directly.
# docs/e2e-mocking-policy.md therefore leaves no exception category open for a
# stand-in here: `IMG` applies only while the real component's image cannot be
# obtained in CI, and `UPS` only to upstreams that cannot run in the CI cluster
# at all. Running the real thing is what the policy asks for, and this fixture
# adds no allowlist entry.
#
# Names mirror production on purpose. The base deployment
# (k8s/deployment.yaml) already wires
# SESSION_PLATFORM_ENDPOINT=http://control-plane.session-platform.svc.cluster.local
# and the kind overlay inherits it verbatim, so a Namespace named
# session-platform holding a Service named control-plane makes that address
# resolve with no overlay change at all.
#
# Configuration is production's, minus the parts that provision session pods:
#   * CRIU_ENABLED and CLAUDE_CODE_ARCHIVE_ENABLED are left unset, i.e. the
#     control plane's own defaults (false). CRIU is also production's value.
#     Together they leave `snapshotEnabled` false, which is what disables the
#     idle reaper (cmd/control-plane/main.go) -- so seeded session state does
#     not drift under the tests. Neither is an auth or security layer, so this
#     is not a `GATE` relaxation.
#   * DATA_PLANE_CLAUDE_CODE_IMAGE stays unset, so `workloadType=claude-code`
#     is not deployable here: such a pod needs the claude-code-credentials
#     Secret through a required SecretKeyRef plus the loopback credential
#     proxy sidecar. Only `shell` sessions can be created in this harness,
#     which is what session-read/AC1 and session-write/AC1 need and no more.
# No env here reads a Secret, so this fixture needs none.
#
# DATA_PLANE_IMAGE **is** set, and that is what changed on 2026-09-04.
# session-list only ever needed the control plane's own state store, so the
# first version of this fixture left the variable unset and the tests seeded
# session ConfigMaps directly. session-read/AC1 and session-write/AC1 cannot be
# observed that way: `Service.Read` calls `agent.Read(ctx, sess.Pod, offset)`,
# and the agent client resolves that pod name to an IP through the Kubernetes
# API before dialling `:8090/read`, so a session whose stored pod name has no
# live pod behind it has nothing to read. Creating one through the product API
# is the path under test, not a shortcut around it.
#
# The data plane image is the real published component at the *same commit tag*
# as the control plane above: session-platform's docker-build-push.yaml
# publishes both from one workflow under the commit SHA, so a matching pair is
# guaranteed to speak the same agent contract. It is a public GHCR package with
# a linux/arm64 manifest, exactly like the control plane, so
# docs/e2e-mocking-policy.md leaves no category open for a stand-in agent here
# either -- `IMG` applies only while the real image cannot be obtained in CI.
# This fixture still adds no allowlist entry. Its ~268 MiB of compressed layers
# are pulled by a ci.yml step and loaded into the kind node *before* any test
# runs, because the control plane gives a session pod two minutes to become
# Ready (defaultReadyTimeout) and that budget must not be spent on a pull.
#
# Session pods carry `serviceAccountName: data-plane` with an automounted token
# (ClientOrchestrator.buildPod), so that ServiceAccount must exist here or the
# pod never starts; it is created below. Production also binds it to the
# built-in `view` ClusterRole and to a node-reader ClusterRole
# (k8s/data-plane-rbac.yaml). Those two ClusterRoleBindings are deliberately
# **not** created here: nothing on the path under test reads the API server
# from inside a session pod -- the shell agent serves /healthz, /read and
# /write and builds no Kubernetes client -- so leaving them out narrows what a
# session pod may do rather than relaxing a gate, and keeps this fixture from
# granting cluster-wide read in the CI cluster.
#
# The image tag is the commit SHA session-platform's main declares as the
# production pin (k8s/deployment.yaml). SHA tags are immutable there -- no
# rolling tag, no :latest -- so the harness is reproducible.
apiVersion: v1
kind: Namespace
metadata:
  name: session-platform
  labels:
    app.kubernetes.io/name: session-platform
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: session-platform
  labels:
    app: control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-plane
  namespace: session-platform
  labels:
    app: data-plane
---
# The same permissions session-platform's own k8s/rbac.yaml grants: session
# pods, the ConfigMap state store, and the per-session Lease locks. Keeping the
# grant identical is what makes this the real component rather than a
# permission-trimmed lookalike.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-pods
  namespace: session-platform
  labels:
    app: control-plane
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-pods
  namespace: session-platform
  labels:
    app: control-plane
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: session-platform
roleRef:
  kind: Role
  name: control-plane-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: session-platform
  labels:
    app: control-plane
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: control-plane
          image: ghcr.io/dlddu/session-platform:5f60249f8381d5cfecbe093bb77fc30d874697f4
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CP_ADDR
              value: ":8080"
            - name: DATA_PLANE_IMAGE
              value: ghcr.io/dlddu/session-platform-data-plane:5f60249f8381d5cfecbe093bb77fc30d874697f4
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: session-platform
  labels:
    app: control-plane
spec:
  type: ClusterIP
  selector:
    app: control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
