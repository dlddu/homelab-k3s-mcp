apiVersion: v1
kind: Namespace
metadata:
  name: workload-test
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-fixture
  namespace: workload-test
  labels:
    app.kubernetes.io/name: workload-fixture
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-fixture
  template:
    metadata:
      labels:
        app: workload-fixture
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
---
# Crash-once fixture for test-resource-generic.md#시나리오 5 (previous=true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-fixture
  namespace: workload-test
  labels:
    app.kubernetes.io/name: crashloop-fixture
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-fixture
  template:
    metadata:
      labels:
        app: crashloop-fixture
    spec:
      volumes:
        - name: state
          emptyDir: {}
      containers:
        - name: boom
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              if [ ! -f /state/crashed ]; then
              echo "crashloop-fixture: boom before exit";
              touch /state/crashed;
              sleep 1;
              exit 1;
              fi;
              echo "crashloop-fixture: recovered";
              exec sleep 2147483647
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
---
# Non-Deployment workload kinds. resource_generic_sc8.py scales the DaemonSet:
# a DaemonSet that really exists makes the refusal observably about the *kind*
# rather than about the object being absent. Both are list-only targets: no
# case waits for their pods, so ci.yml needs no extra rollout step.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workload-fixture-sts
  namespace: workload-test
  labels:
    app.kubernetes.io/name: workload-fixture-sts
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  serviceName: workload-fixture-sts
  replicas: 1
  selector:
    matchLabels:
      app: workload-fixture-sts
  template:
    metadata:
      labels:
        app: workload-fixture-sts
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: workload-fixture-ds
  namespace: workload-test
  labels:
    app.kubernetes.io/name: workload-fixture-ds
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  selector:
    matchLabels:
      app: workload-fixture-ds
  template:
    metadata:
      labels:
        app: workload-fixture-ds
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 16Mi
