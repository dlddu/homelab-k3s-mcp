---
apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp-oauth-only
  namespace: homelab-k3s-mcp-oauth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-oauth-only
