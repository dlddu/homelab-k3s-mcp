---
# (d) Neither credential path configured, and MCP_AUTH_DISABLED is NOT set.
#
# This deployment is expected to CRASHLOOP, and that is the assertion: main.go
# calls auth.FromEnv, which refuses to build a config when nothing gates /mcp,
# and exits 1 rather than serve the endpoint undefended. It carries no probes and
# no Service because it never serves, and .github/workflows/ci.yml deliberately
# does NOT wait for its rollout -- waiting would block CI on a pod that is
# supposed to never become Available.
#
# It is also what keeps the AC2 argument honest: "the OAuth deployments are
# Available, therefore they completed OIDC discovery and the JWKS fetch at
# startup" only means something because a server that fails that path really does
# stay down, and this is where that is observed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-no-auth
  namespace: homelab-k3s-mcp-oauth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-no-auth
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-no-auth
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-no-auth
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
