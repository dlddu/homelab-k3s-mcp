# OIDC issuer + the auth-configuration deployment variants that
# platform-auth-safety/AC2 (인증 디스커버리) and /AC8 (인증 방식 구성 유연성) need.
#
# No credential secrets are attached to any of the servers, for the same reason
# auth-fixture.yaml attaches none: main.go's buildXService helpers degrade to an
# unavailable service and the server still starts, which is all these ACs need.
apiVersion: v1
kind: Namespace
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
# Minimal dex configuration. cmd/dex/config.go::Validate() requires issuer,
# storage and a web listen address; server.NewServer additionally refuses to
# start with zero connectors ("server: no connectors specified",
# server/server.go). enablePasswordDB satisfies that by appending dex's built-in
# local connector. AC2/AC8 need only discovery and the key set, never a login.
#
# The password grant below is for test-event-log.md#시나리오 6 (2026-09-21): an
# expired JWT has to be one this issuer signed, so event_log_sc6.py
# mints one through `POST /token` (grant_type=password, the local connector)
# and lets it expire. idTokens is short for that reason alone; nothing else in
# this cluster consumes a dex token. The static client id equals the servers'
# MCP_OAUTH_AUDIENCE because dex sets `aud` to the client id. The bcrypt hash is
# dex's own example hash of the string "password" (examples/config-dev.yaml).
#
# Memory storage keeps the signing keys in-process; dex creates the initial RSA
# key set at startup, which is what makes /keys non-empty on the first fetch.
#
# The issuer value must equal MCP_OAUTH_ISSUER on the servers below and ISSUER in
# tests/integration/_oidc.py. It carries no path component, so discovery is at
# /.well-known/openid-configuration and the key set at /keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  namespace: dex
data:
  config.yaml: |
    issuer: http://dex.dex.svc.cluster.local:5556
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    enablePasswordDB: true
    oauth2:
      passwordConnector: local
    staticClients:
      - id: homelab-k3s-mcp
        name: homelab-k3s-mcp e2e
        secret: ci-oauth-e2e-client-secret
    staticPasswords:
      - email: e2e@homelab-k3s-mcp.test
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: e2e
        userID: 1f7a0c7e-5b2e-4f43-9c1a-6c6f2b0e4d21
    expiry:
      idTokens: 20s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          # Pinned by digest: the tag alone would let the issuer change under a
          # rerun, and these ACs assert what it serves.
          image: ghcr.io/dexidp/dex:v2.44.0@sha256:5d0656fce7d453c0e3b2706abf40c0d0ce5b371fb0b73b3cf714d05f35fa5f86
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
          # Readiness is the discovery document rather than /healthz: a server
          # that answers /healthz but has not published its key set yet would let
          # the MCP variants below start their OIDC discovery too early.
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  type: ClusterIP
  selector:
    app: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-k3s-mcp-oauth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-oauth
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
# (c) Both credential paths configured.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-oauth
  namespace: homelab-k3s-mcp-oauth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-oauth
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-oauth
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-oauth
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # Must match ISSUER/AUDIENCE/RESOURCE in tests/integration/_oidc.py.
            - name: MCP_OAUTH_ISSUER
              value: http://dex.dex.svc.cluster.local:5556
            - name: MCP_OAUTH_AUDIENCE
              value: homelab-k3s-mcp
            - name: MCP_OAUTH_RESOURCE
              value: http://homelab-k3s-mcp-oauth.homelab-k3s-mcp-oauth.svc.cluster.local
            # Throwaway CI credential; must match API_KEY in _oidc.py. Distinct
            # from the auth-variant's key so a test cannot pass by presenting the
            # wrong deployment's key.
            - name: MCP_API_KEYS
              value: ci-oauth-e2e-key
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp-oauth
  namespace: homelab-k3s-mcp-oauth
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-oauth
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-k3s-mcp-oauth
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
