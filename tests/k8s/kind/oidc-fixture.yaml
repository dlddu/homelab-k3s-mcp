            - name: MCP_OAUTH_RESOURCE
              value: http://homelab-k3s-mcp-oauth-only.homelab-k3s-mcp-oauth.svc.cluster.local
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
