apiVersion: v1
kind: Namespace
metadata:
  name: dear-baby-test
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # 등재: docs/e2e-mocking-policy.md
  # mock-exception: IMG — 실 백엔드 이미지가 비공개라 CI 에서 당길 수 없다.
  name: dear-baby-fixture
  namespace: dear-baby-test
  labels:
    app.kubernetes.io/name: dear-baby-fixture
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dear-baby
  template:
    metadata:
      labels:
        app: dear-baby
    spec:
      containers:
        - name: backend
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /reset-user <<'STUB'
              #!/bin/sh
              set -eu
              EMAIL="${1:-}"
              if [ -z "$EMAIL" ]; then
                echo "usage: reset-user <email>" >&2
                exit 2
              fi
              case "$EMAIL" in
                missing@*)
                  echo "no user found with email \"$EMAIL\"" >&2
                  exit 1
                  ;;
              esac
              echo "reset user for $EMAIL"
              STUB
              chmod +x /reset-user
              exec sleep infinity
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 50m
              memory: 32Mi
