apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homelab-k3s-mcp

resources:
  - ../../../k8s

images:
  - name: ghcr.io/dlddu/homelab-k3s-mcp
    newName: homelab-k3s-mcp
    newTag: ci

configMapGenerator:
  - name: homelab-k3s-mcp-oauth
    literals:
      # 등재: docs/e2e-mocking-policy.md — 대체 검증은 auth-fixture.yaml(인증을 켠 변형)
      # mock-exception: GATE — 인증이 검증 대상이 아닌 도구 e2e 를 관측하려면 게이트를 내려야 한다.
      - MCP_AUTH_DISABLED=1
    options:
      disableNameSuffixHash: true
