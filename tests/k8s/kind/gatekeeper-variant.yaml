# Gatekeeper-wired SUT variant for the approval-gate e2e
# (approval_gate_ac{2,4,9}.py) and resource_generic_ac17.py.
#
# The primary kind deployment can carry the gate too, but three observation
# designs need their own env values, and env is per deployment:
#
# * GATEKEEPER_TIMEOUT_SECONDS=5 with GATEKEEPER_POLL_INTERVAL_SECONDS=1 --
#   scenario 4(b) observes an expired verdict in seconds instead of waiting out
#   the 300 s default. The expiry and the client deadline both derive from
#   GATEKEEPER_TIMEOUT_SECONDS, so the e2e asserts the REFUSAL LATENCY (>= the
#   timeout) plus the gatekeeper record reading EXPIRED, never the wording of
#   the client error -- which of the two fires is a timer tie in the client.
# * GATEKEEPER_USER_ID -- auto-response modes (scenario 9) engage only when the
#   create body carries a users.id, and ids are cuid values a fixture cannot
#   know in advance. ci.yml seeds the user through the forward-auth path and
#   pins the discovered id into the secret this deployment consumes.
# * RESOURCE_GATED_KINDS -- test-resource-generic.md scenario 17(b) asks for a
#   fixture CRD to be read through the sensitive-kind gate. That list is
#   replaced rather than extended per deployment (see the env comment below).
#
# GATEKEEPER_BASE_URL points at the recording proxy (gatekeeper-trace), not at
# gatekeeper directly, so scenario 2 can assert the create contract. The
# primary keeps pointing straight at the gatekeeper Service: its scenarios need
# no request-body observation, and a shorter path is one less thing to break.
#
# The dedicated ClusterRoleBinding exists for the same reason the primary's
# does (k8s/rbac.yaml): authorization is per ServiceAccount, and the primary's
# binding names only the primary namespace's SA.
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-k3s-mcp-gatekeeper-variant
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-k3s-mcp
  namespace: homelab-k3s-mcp-gatekeeper-variant
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-k3s-mcp:gatekeeper-variant-workloads
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: homelab-k3s-mcp
    namespace: homelab-k3s-mcp-gatekeeper-variant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-k3s-mcp-gatekeeper-variant
  namespace: homelab-k3s-mcp-gatekeeper-variant
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: homelab-k3s-mcp-tests
    spec:
      serviceAccountName: homelab-k3s-mcp
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: homelab-k3s-mcp:ci
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: 0.0.0.0:3000
            - name: LOG_LEVEL
              value: info
            # 등재: docs/e2e-mocking-policy.md — 대체 검증은 auth-fixture.yaml(인증을 켠 변형)
            # mock-exception: GATE — 이 변형의 검증 대상은 gatekeeper 왕복이지 인증이 아니다. env 는 배포당이라 기본 배포의 완화를 물려받을 수 없어 여기서 다시 내린다.
            - name: MCP_AUTH_DISABLED
              value: "1"
            - name: GATEKEEPER_TIMEOUT_SECONDS
              value: "5"
            - name: GATEKEEPER_POLL_INTERVAL_SECONDS
              value: "1"
            # test-resource-generic.md#시나리오 17 (b) asks for a fixture CRD added to
            # the sensitive-kind list, and this list is per deployment. It cannot go
            # on the primary: resource_generic_ac1.py reads the same CRD there and
            # would start needing an approval for it. The default value is repeated
            # on purpose -- this env replaces the list rather than extending it, so
            # dropping v1/Secret here would silently ungate every Secret read this
            # deployment serves.
            - name: RESOURCE_GATED_KINDS
              value: v1/Secret,homelab-k3s-mcp.test/v1/ResourceGenericSample
          envFrom:
            - secretRef:
                name: homelab-k3s-mcp-gatekeeper
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-k3s-mcp-gatekeeper-variant
  namespace: homelab-k3s-mcp-gatekeeper-variant
  labels:
    app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homelab-k3s-mcp-gatekeeper-variant
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
