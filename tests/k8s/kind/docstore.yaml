apiVersion: v1
kind: Namespace
metadata:
  name: docstore
  labels:
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docstore
  namespace: docstore
  labels:
    app.kubernetes.io/name: docstore
    app.kubernetes.io/part-of: homelab-k3s-mcp-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docstore
  template:
    metadata:
      labels:
        app: docstore
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: docstore
          image: ghcr.io/dlddu/docstore:59980518a71185c1dc43eb2ec34d52ae01a1555d
          env:
            - name: DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: docstore
  namespace: docstore
spec:
  selector:
    app: docstore
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
