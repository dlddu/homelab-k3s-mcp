name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + vet
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # AC(docs/prd-*.md) <-> tests/integration/*.py 파일 1:1 정합성. 표준 라이브러리만
      # 쓰고 클러스터가 필요 없어 여기서 돈다. docs/doc-tracker.md 의 레지스트리·집계가
      # 실측과 어긋나거나, 매칭 단위 파일이 run_all.py 에 배차되지 않으면 실패한다.
      - name: AC <-> e2e file mapping
        run: python3 tests/integration/check_ac_mapping.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  unit-tests:
    name: unit tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: go test
        run: go test ./... -v

  integration-tests:
    name: integration tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go test
        run: go test ./... -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python integration test deps
        run: pip install -r tests/integration/requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: homelab-k3s-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # OpenSearch refuses to start when the host vm.max_map_count is below
      # its bootstrap check; kind nodes share the runner kernel, so raise it
      # here before the fixture is scheduled.
      - name: Raise vm.max_map_count for the OpenSearch fixture
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: homelab-k3s-mcp
          wait: 120s

      - name: Load image into kind
        run: kind load docker-image homelab-k3s-mcp:ci --name homelab-k3s-mcp

      - name: Deploy github-mock fixture
        run: kubectl apply -f tests/k8s/kind/github-mock.yaml

      - name: Deploy MinIO fixture
        run: kubectl apply -f tests/k8s/kind/minio.yaml

      - name: Deploy grafana-mock fixture
        run: kubectl apply -f tests/k8s/kind/grafana-mock.yaml

      - name: Deploy OpenSearch fixture
        run: kubectl apply -f tests/k8s/kind/opensearch.yaml

      # Recording proxy in front of MinIO (S3 + STS) and OpenSearch. The
      # endpoints below point the server at it instead of at the upstreams
      # directly, which is what makes the AssumeRole -> SigV4 access path
      # observable to the integration tests (aws-config-get/AC2,
      # opensearch-{search/AC3,document-put/AC4,document-delete/AC4}).
      - name: Deploy http-trace fixture
        run: kubectl apply -f tests/k8s/kind/http-trace.yaml

      - name: Create homelab-k3s-mcp namespace
        run: kubectl create namespace homelab-k3s-mcp --dry-run=client -o yaml | kubectl apply -f -

      - name: Create test GitHub App secret
        run: |
          openssl genrsa -out /tmp/github-app-test-key.pem 2048
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-github-app \
            --from-literal=GITHUB_APP_CLIENT_ID=Iv1.testclientid12345 \
            --from-literal=GITHUB_APP_INSTALLATION_ID=67890 \
            --from-literal=GITHUB_API_BASE_URL=http://github-mock.github-mock.svc.cluster.local \
            --from-file=GITHUB_APP_PRIVATE_KEY=/tmp/github-app-test-key.pem \
            --dry-run=client -o yaml | kubectl apply -f -

      # AWS_CONFIG_S3_ENDPOINT points at the http-trace proxy rather than at
      # MinIO directly (the proxy forwards to MinIO preserving the signed Host
      # header). That is what lets aws_config.py observe which credential
      # signed the GetObject.
      - name: Create test AWS config secret
        run: |
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-aws-config \
            --from-literal=AWS_CONFIG_S3_BUCKET=ci-config-bucket \
            --from-literal=AWS_CONFIG_S3_KEY=aws/config \
            --from-literal=AWS_CONFIG_ROLE_ARN=arn:aws:iam::000000000000:role/ci-config-reader \
            --from-literal=AWS_CONFIG_S3_REGION=us-east-1 \
            --from-literal=AWS_CONFIG_S3_ENDPOINT=http://http-trace.http-trace.svc.cluster.local:9000 \
            --from-literal=AWS_ACCESS_KEY_ID=minioadmin \
            --from-literal=AWS_SECRET_ACCESS_KEY=minioadmin \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create test Grafana secret
        run: |
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-grafana \
            --from-literal=GRAFANA_ISSUER_TOKEN=glsa_mock_issuer \
            --from-literal=GRAFANA_READ_POLICY_ID=ci-read-policy \
            --from-literal=GRAFANA_REGION=ci-region \
            --from-literal=GRAFANA_API_URL=http://grafana-mock.grafana-mock.svc.cluster.local/api \
            --from-literal=GRAFANA_METRICS_URL=https://prometheus-prod-ci.grafana.net/api/prom \
            --from-literal=GRAFANA_METRICS_USER=111111 \
            --from-literal=GRAFANA_LOGS_URL=https://logs-prod-ci.grafana.net \
            --from-literal=GRAFANA_LOGS_USER=222222 \
            --dry-run=client -o yaml | kubectl apply -f -

      # Both endpoints point at the http-trace proxy: :9000 forwards to MinIO
      # (the AssumeRole call, sharing the aws-config secret's base credentials)
      # and :9200 forwards to OpenSearch (the signed data-plane requests).
      # Recording both on one proxy is what lets opensearch.py correlate the
      # key STS issued with the key that signed each data-plane request.
      - name: Create test OpenSearch secret
        run: |
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-opensearch \
            --from-literal=OPENSEARCH_ENDPOINT=http://http-trace.http-trace.svc.cluster.local:9200 \
            --from-literal=OPENSEARCH_ROLE_ARN=arn:aws:iam::000000000000:role/ci-opensearch \
            --from-literal=OPENSEARCH_REGION=us-east-1 \
            --from-literal=OPENSEARCH_STS_ENDPOINT=http://http-trace.http-trace.svc.cluster.local:9000 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy via kustomize (kind overlay)
        run: kubectl apply -k tests/k8s/kind

      - name: Apply workload test fixture
        run: kubectl apply -f tests/k8s/kind/test-deployment.yaml

      - name: Apply dear-baby exec fixture
        run: kubectl apply -f tests/k8s/kind/dear-baby-fixture.yaml

      - name: Apply auth-variant fixture
        run: kubectl apply -f tests/k8s/kind/auth-fixture.yaml

      - name: Wait for github-mock rollout
        run: kubectl -n github-mock rollout status deploy/github-mock --timeout=180s

      - name: Wait for MinIO rollout
        run: kubectl -n minio rollout status deploy/minio --timeout=180s

      - name: Wait for grafana-mock rollout
        run: kubectl -n grafana-mock rollout status deploy/grafana-mock --timeout=180s

      - name: Wait for MinIO seed job
        run: kubectl -n minio wait --for=condition=complete job/minio-seed --timeout=120s

      - name: Wait for OpenSearch rollout
        run: kubectl -n opensearch rollout status deploy/opensearch --timeout=300s

      # Has to be ready before the first tool call: the server caches the
      # credentials it assumes, so an AssumeRole that bypassed the proxy would
      # never be re-issued and could never be observed.
      - name: Wait for http-trace rollout
        run: kubectl -n http-trace rollout status deploy/http-trace --timeout=180s

      - name: Wait for rollout
        run: kubectl -n homelab-k3s-mcp rollout status deploy/homelab-k3s-mcp --timeout=180s

      - name: Wait for fixture rollout
        run: kubectl -n workload-test rollout status deploy/workload-fixture --timeout=120s

      - name: Wait for dear-baby fixture rollout
        run: kubectl -n dear-baby-test rollout status deploy/dear-baby-fixture --timeout=120s

      - name: Wait for auth-variant rollout
        run: kubectl -n homelab-k3s-mcp-auth rollout status deploy/homelab-k3s-mcp-auth --timeout=120s

      # 파일별 스텝을 나열하지 않는다. tests/integration/run_all.py 가 매칭 단위 파일을
      # 자동 발견해 각 파일이 모듈 docstring에 신고한 `실행 대상`(primary / auth-variant)
      # 별로 실행하므로, AC를 전용 파일로 쪼갤 때 이 워크플로를 고칠 필요가 없다.
      # 배차 누락(= 만들어 놓고 실행되지 않는 파일)은 lint 잡의 check_ac_mapping.py 가 막는다.
      #
      # 포트포워드는 그룹 하나가 여러 파일을 도는 동안 살아 있어야 하므로 재시도 루프로
      # 띄운다. 끊겨도 곧바로 되살아나고, 각 테스트 파일이 시작할 때 healthz 를 기다린다.
      - name: Run integration tests (primary deployment)
        run: |
          ( while true; do kubectl -n homelab-k3s-mcp port-forward svc/homelab-k3s-mcp 8080:80 >>/tmp/pf-primary.log 2>&1; sleep 1; done ) &
          PF_PID=$!
          ( while true; do kubectl -n http-trace port-forward svc/http-trace 8090:8081 >>/tmp/pf-trace.log 2>&1; sleep 1; done ) &
          TRACE_PID=$!
          trap 'kill $PF_PID $TRACE_PID 2>/dev/null || true; pkill -f "port-forward svc/homelab-k3s-mcp" || true; pkill -f "port-forward svc/http-trace" || true' EXIT
          python tests/integration/run_all.py --group primary \
            --base-url http://127.0.0.1:8080 --trace-url http://127.0.0.1:8090

      # 인증을 켜고 자격증명 시크릿을 하나도 붙이지 않은 배포 변형
      # (tests/k8s/kind/auth-fixture.yaml). 인증 게이트와 "미설정 시 graceful 거부" 는
      # 이 배포에서만 관측된다.
      - name: Run integration tests (auth-variant deployment)
        run: |
          ( while true; do kubectl -n homelab-k3s-mcp-auth port-forward svc/homelab-k3s-mcp-auth 8088:80 >>/tmp/pf-auth.log 2>&1; sleep 1; done ) &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true; pkill -f "port-forward svc/homelab-k3s-mcp-auth" || true' EXIT
          python tests/integration/run_all.py --group auth-variant --base-url http://127.0.0.1:8088

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl -n homelab-k3s-mcp get all -o wide || true
          kubectl -n homelab-k3s-mcp describe deploy/homelab-k3s-mcp || true
          kubectl -n homelab-k3s-mcp logs deploy/homelab-k3s-mcp --tail=200 || true
          kubectl -n workload-test get all -o wide || true
          kubectl -n workload-test describe deploy/workload-fixture || true
          kubectl -n dear-baby-test get all -o wide || true
          kubectl -n dear-baby-test describe deploy/dear-baby-fixture || true
          kubectl -n dear-baby-test logs deploy/dear-baby-fixture --tail=200 || true
          kubectl -n github-mock get all -o wide || true
          kubectl -n github-mock describe deploy/github-mock || true
          kubectl -n github-mock logs deploy/github-mock --tail=200 || true
          kubectl -n minio get all -o wide || true
          kubectl -n minio describe deploy/minio || true
          kubectl -n minio logs deploy/minio --tail=200 || true
          kubectl -n minio logs job/minio-seed --tail=200 || true
          kubectl -n grafana-mock get all -o wide || true
          kubectl -n grafana-mock describe deploy/grafana-mock || true
          kubectl -n grafana-mock logs deploy/grafana-mock --tail=200 || true
          kubectl -n opensearch get all -o wide || true
          kubectl -n opensearch describe deploy/opensearch || true
          kubectl -n opensearch logs deploy/opensearch --tail=200 || true
          kubectl -n http-trace get all -o wide || true
          kubectl -n http-trace describe deploy/http-trace || true
          kubectl -n http-trace logs deploy/http-trace --tail=200 || true
          kubectl -n homelab-k3s-mcp-auth get all -o wide || true
          kubectl -n homelab-k3s-mcp-auth describe deploy/homelab-k3s-mcp-auth || true
          kubectl -n homelab-k3s-mcp-auth logs deploy/homelab-k3s-mcp-auth --tail=200 || true

  docker:
    name: docker build & push
    runs-on: ubuntu-24.04-arm
    needs: [lint, unit-tests, integration-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=homelab-k3s-mcp
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
