name: CI

# 검증만 한다. 이미지는 여기서 *빌드해서 kind 에 load* 할 뿐 레지스트리로 나가지 않는다 —
# pull 가능한 태그를 발행하고 main 을 그 SHA 로 고정하는 것은 docker-build-push.yaml 이다.
# 예전에는 이 파일의 `docker` 잡이 `latest` 까지 밀었고 브랜치 조건이 없어 PR 빌드도 그
# 태그를 덮어썼다(= 운영이 미머지 코드를 pull 할 수 있었다). 그 잡을 옮기며 없앴다.

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + vet
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # AC(docs/prd-*.md) <-> tests/integration/*.py 파일 1:1 정합성. 표준 라이브러리만
      # 쓰고 클러스터가 필요 없어 여기서 돈다. docs/doc-tracker.md 의 레지스트리·집계가
      # 실측과 어긋나거나, 매칭 단위 파일이 run_all.py 에 배차되지 않으면 실패한다.
      - name: AC <-> e2e file mapping
        run: python3 tests/integration/check_ac_mapping.py

      # docs/e2e-mocking-policy.md 의 허용목록 <-> tests/·.github/workflows/ 의 실제 모킹
      # 지점 양방향 1:1. 이것도 표준 라이브러리 전용에 클러스터가 필요 없어 여기서 돈다.
      # 미등재 모킹·고아 등재·표기 주석 누락·GATE 의 대체 검증 부재가 전부 실패다.
      - name: E2E mocking policy
        run: python3 scripts/check_mock_policy.py

      # docs/comment-policy/ledger.md 의 판정 이력 원장 <-> 실제 주석 상태. 등재된 범위의 주석이
      # 판정 이후 바뀌었으면(= 그 범위가 다시 판정받아야 하면) 실패한다. 「이 주석이 중복인가」
      # 자체는 판정하지 않는다 — 그건 정책의 판정 절차대로 사람이 한다. 표준 라이브러리 전용에
      # 클러스터가 필요 없어 여기서 돈다.
      - name: Comment policy ledger
        run: python3 scripts/check_comment_policy.py

      # docs/doc-tracker.md 의 「허브 도달 가능 문서」 집계 <-> docs/ 실측. 문서를 추가하면서
      # 그 줄을 함께 올리지 않으면 실패하고, 허브(index.html)에서 이행적으로 도달할 수 없는
      # 문서나 끊긴 .md 링크도 잡는다. 표준 라이브러리 전용에 클러스터가 필요 없어 여기서 돈다.
      - name: Doc hub inventory
        run: python3 scripts/check_doc_inventory.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...

  unit-tests:
    name: unit tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: go test
        run: go test ./... -v

  integration-tests:
    name: integration tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go test
        run: go test ./... -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python integration test deps
        run: pip install -r tests/integration/requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: homelab-k3s-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # OpenSearch refuses to start when the host vm.max_map_count is below
      # its bootstrap check; kind nodes share the runner kernel, so raise it
      # here before the fixture is scheduled.
      - name: Raise vm.max_map_count for the OpenSearch fixture
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: homelab-k3s-mcp
          wait: 120s

      - name: Load image into kind
        run: kind load docker-image homelab-k3s-mcp:ci --name homelab-k3s-mcp

      - name: Deploy github-mock fixture
        run: kubectl apply -f tests/k8s/kind/github-mock.yaml

      - name: Deploy MinIO fixture
        run: kubectl apply -f tests/k8s/kind/minio.yaml

      - name: Deploy grafana-mock fixture
        run: kubectl apply -f tests/k8s/kind/grafana-mock.yaml

      - name: Deploy OpenSearch fixture
        run: kubectl apply -f tests/k8s/kind/opensearch.yaml

      # Recording proxy in front of MinIO (S3 + STS) and OpenSearch. The
      # endpoints below point the server at it instead of at the upstreams
      # directly, which is what makes the AssumeRole -> SigV4 access path
      # observable to the integration tests (aws-config-get/AC2,
      # opensearch-{search/AC3,document-put/AC4,document-delete/AC4}).
      - name: Deploy http-trace fixture
        run: kubectl apply -f tests/k8s/kind/http-trace.yaml

      # Real gatekeeper for the approval-gate e2e (approval_gate_ac*.py) plus
      # the recording proxy in front of it. Deployed and waited here, before the
      # SUT secrets exist, because seeding the e2e user (below) needs the
      # gatekeeper API alive and the secrets must exist before the SUTs start --
      # the gate reads its env once, at startup.
      - name: Deploy gatekeeper fixture
        run: kubectl apply -f tests/k8s/kind/gatekeeper-fixture.yaml

      - name: Wait for gatekeeper fixture rollout
        run: |
          kubectl -n gatekeeper rollout status deploy/gatekeeper --timeout=300s
          kubectl -n gatekeeper rollout status deploy/gatekeeper-trace --timeout=180s

      - name: Create homelab-k3s-mcp namespace
        run: kubectl create namespace homelab-k3s-mcp --dry-run=client -o yaml | kubectl apply -f -

      - name: Create test GitHub App secret
        run: |
          openssl genrsa -out /tmp/github-app-test-key.pem 2048
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-github-app \
            --from-literal=GITHUB_APP_CLIENT_ID=Iv1.testclientid12345 \
            --from-literal=GITHUB_APP_INSTALLATION_ID=67890 \
            --from-literal=GITHUB_API_BASE_URL=http://github-mock.github-mock.svc.cluster.local \
            --from-file=GITHUB_APP_PRIVATE_KEY=/tmp/github-app-test-key.pem \
            --dry-run=client -o yaml | kubectl apply -f -

      # AWS_CONFIG_S3_ENDPOINT points at the http-trace proxy rather than at
      # MinIO directly (the proxy forwards to MinIO preserving the signed Host
      # header). That is what lets aws_config_get_ac2.py observe which
      # credential signed the GetObject.
      - name: Create test AWS config secret
        run: |
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-aws-config \
            --from-literal=AWS_CONFIG_S3_BUCKET=ci-config-bucket \
            --from-literal=AWS_CONFIG_S3_KEY=aws/config \
            --from-literal=AWS_CONFIG_ROLE_ARN=arn:aws:iam::000000000000:role/ci-config-reader \
            --from-literal=AWS_CONFIG_S3_REGION=us-east-1 \
            --from-literal=AWS_CONFIG_S3_ENDPOINT=http://http-trace.http-trace.svc.cluster.local:9000 \
            --from-literal=AWS_ACCESS_KEY_ID=minioadmin \
            --from-literal=AWS_SECRET_ACCESS_KEY=minioadmin \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create test Grafana secret
        run: |
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-grafana \
            --from-literal=GRAFANA_ISSUER_TOKEN=glsa_mock_issuer \
            --from-literal=GRAFANA_READ_POLICY_ID=ci-read-policy \
            --from-literal=GRAFANA_REGION=ci-region \
            --from-literal=GRAFANA_API_URL=http://grafana-mock.grafana-mock.svc.cluster.local/api \
            --from-literal=GRAFANA_METRICS_URL=https://prometheus-prod-ci.grafana.net/api/prom \
            --from-literal=GRAFANA_METRICS_USER=111111 \
            --from-literal=GRAFANA_LOGS_URL=https://logs-prod-ci.grafana.net \
            --from-literal=GRAFANA_LOGS_USER=222222 \
            --dry-run=client -o yaml | kubectl apply -f -

      # Both endpoints point at the http-trace proxy: :9000 forwards to MinIO
      # (the AssumeRole call, sharing the aws-config secret's base credentials)
      # and :9200 forwards to OpenSearch (the signed data-plane requests).
      # Recording both on one proxy is what lets the opensearch *_ac*.py
      # access-path cases correlate the key STS issued with the key that
      # signed each data-plane request.
      - name: Create test OpenSearch secret
        run: |
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-opensearch \
            --from-literal=OPENSEARCH_ENDPOINT=http://http-trace.http-trace.svc.cluster.local:9200 \
            --from-literal=OPENSEARCH_ROLE_ARN=arn:aws:iam::000000000000:role/ci-opensearch \
            --from-literal=OPENSEARCH_REGION=us-east-1 \
            --from-literal=OPENSEARCH_STS_ENDPOINT=http://http-trace.http-trace.svc.cluster.local:9000 \
            --dry-run=client -o yaml | kubectl apply -f -

      # Gatekeeper's API key plus the VAPID values the deployment requires but
      # this harness never exercises (push.NewService validates nothing at
      # startup; dispatchPush is fire-and-forget). The e2e user is created
      # through the forward-auth path and its users.id pinned into the variant
      # secret: GATEKEEPER_USER_ID must be a users.id, which only exists after
      # the first forward-auth request, so the id cannot be baked into a
      # manifest. The main SUT reaches gatekeeper directly; the variant goes
      # through the recording proxy because approval_gate_ac2.py asserts the
      # create body, which only the proxy observes.
      - name: Create gatekeeper test secret and seed the e2e user
        run: |
          GK_KEY="$(openssl rand -hex 24)"
          kubectl -n gatekeeper create secret generic gatekeeper-secrets \
            --from-literal=API_SECRET_KEY="$GK_KEY" \
            --from-literal=VAPID_SUBJECT=mailto:ci-e2e@invalid \
            --from-literal=VAPID_PUBLIC_KEY=ci-e2e-unused \
            --from-literal=VAPID_PRIVATE_KEY=ci-e2e-unused \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n gatekeeper run gatekeeper-seed --quiet --rm -i --restart=Never \
            --image=curlimages/curl --image-pull-policy=IfNotPresent -- \
            -sS -H 'Remote-User: gatekeeper-e2e' http://gatekeeper/api/me/ >/tmp/gk-me.json
          GK_USER_ID="$(python3 -c 'import json; print(json.load(open("/tmp/gk-me.json"))["id"])')"
          kubectl -n homelab-k3s-mcp create secret generic homelab-k3s-mcp-gatekeeper \
            --from-literal=GATEKEEPER_BASE_URL=http://gatekeeper.gatekeeper.svc.cluster.local \
            --from-literal=GATEKEEPER_API_KEY="$GK_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n homelab-k3s-mcp-gatekeeper-variant create secret generic homelab-k3s-mcp-gatekeeper \
            --from-literal=GATEKEEPER_BASE_URL=http://gatekeeper-trace.gatekeeper.svc.cluster.local:3000 \
            --from-literal=GATEKEEPER_API_KEY="$GK_KEY" \
            --from-literal=GATEKEEPER_USER_ID="$GK_USER_ID" \
            --dry-run=client -o yaml | kubectl apply -f -
          # The e2e's record reads need the same key: GET /api/requests/{id} is
          # API-key protected (only the list is public), and that route is where
          # the read-time EXPIRED evaluation happens.
          echo "GATEKEEPER_E2E_API_KEY=$GK_KEY" >> "$GITHUB_ENV"

      - name: Deploy via kustomize (kind overlay)
        run: kubectl apply -k tests/k8s/kind

      - name: Apply workload test fixture
        run: kubectl apply -f tests/k8s/kind/test-deployment.yaml

      # workload-test 네임스페이스는 바로 위 스텝이 만든다. CRD 와 그 인스턴스가 두 파일로
      # 갈린 이유는 픽스처 파일 머리말에 있다 — 사이에 established 대기가 들어가야 한다.
      # 준비 대기 스텝은 따로 두지 않는다: resource_generic_ac1.py 가 자기 선행 조건을
      # 멱등 폴링으로 성립시킨다.
      - name: Apply resource-generic fixture
        run: |
          kubectl apply -f tests/k8s/kind/resource-generic-fixture.yaml
          kubectl wait --for=condition=established --timeout=60s \
            crd/resourcegenericsamples.homelab-k3s-mcp.test
          kubectl apply -f tests/k8s/kind/resource-generic-samples.yaml

      - name: Apply dear-baby exec fixture
        run: kubectl apply -f tests/k8s/kind/dear-baby-fixture.yaml

      - name: Apply auth-variant fixture
        run: kubectl apply -f tests/k8s/kind/auth-fixture.yaml

      - name: Apply gatekeeper-variant fixture
        run: kubectl apply -f tests/k8s/kind/gatekeeper-variant.yaml

      # The session pod image, preloaded into the kind node. The control plane
      # gives a session pod two minutes to report Ready and that budget covers
      # the image pull, so a ~268 MiB cold pull inside it is the difference
      # between session-read/AC1 passing and timing out. Preloading moves the
      # pull here; the control plane pins the image by commit SHA, which it
      # renders as imagePullPolicy IfNotPresent, so the preloaded copy is used.
      - name: Preload the session-platform data plane image into kind
        run: |
          image="$(grep -o 'ghcr.io/dlddu/session-platform-data-plane:[0-9a-f]*' \
            tests/k8s/kind/session-platform.yaml | head -1)"
          echo "preloading $image"
          docker pull --platform linux/arm64 "$image"
          kind load docker-image "$image" --name homelab-k3s-mcp

      # The real session-platform control plane (public image, pinned to the SHA
      # its repo declares for production). session_list talks to it over the
      # cluster-internal address the base deployment already carries, so this
      # needs no overlay change -- only the namespace and Service names to match
      # production, which they do.
      - name: Apply session-platform control plane fixture
        run: kubectl apply -f tests/k8s/kind/session-platform.yaml

      # Real OIDC issuer (dex) plus the three auth-configuration variants that
      # platform-auth-safety/AC2 and /AC8 need. The MCP variants here perform OIDC
      # discovery at startup and exit 1 when it fails, so they restart until dex
      # answers -- the rollout wait below is what absorbs that.
      - name: Apply OIDC issuer and auth-configuration fixture
        run: kubectl apply -f tests/k8s/kind/oidc-fixture.yaml

      - name: Wait for github-mock rollout
        run: kubectl -n github-mock rollout status deploy/github-mock --timeout=180s

      - name: Wait for MinIO rollout
        run: kubectl -n minio rollout status deploy/minio --timeout=180s

      - name: Wait for grafana-mock rollout
        run: kubectl -n grafana-mock rollout status deploy/grafana-mock --timeout=180s

      - name: Wait for MinIO seed job
        run: kubectl -n minio wait --for=condition=complete job/minio-seed --timeout=120s

      - name: Wait for OpenSearch rollout
        run: kubectl -n opensearch rollout status deploy/opensearch --timeout=300s

      # Has to be ready before the first tool call: the server caches the
      # credentials it assumes, so an AssumeRole that bypassed the proxy would
      # never be re-issued and could never be observed.
      - name: Wait for http-trace rollout
        run: kubectl -n http-trace rollout status deploy/http-trace --timeout=180s

      - name: Wait for rollout
        run: kubectl -n homelab-k3s-mcp rollout status deploy/homelab-k3s-mcp --timeout=180s

      - name: Wait for fixture rollout
        run: kubectl -n workload-test rollout status deploy/workload-fixture --timeout=120s

      - name: Wait for dear-baby fixture rollout
        run: kubectl -n dear-baby-test rollout status deploy/dear-baby-fixture --timeout=120s

      - name: Wait for auth-variant rollout
        run: kubectl -n homelab-k3s-mcp-auth rollout status deploy/homelab-k3s-mcp-auth --timeout=120s

      - name: Wait for gatekeeper-variant rollout
        run: kubectl -n homelab-k3s-mcp-gatekeeper-variant rollout status deploy/homelab-k3s-mcp-gatekeeper-variant --timeout=120s

      # Ready before the primary group runs: session_list_ac{1,2}.py seed and
      # read this control plane. The image is pulled from GHCR (not kind-loaded),
      # so allow for the pull.
      - name: Wait for session-platform control plane rollout
        run: kubectl -n session-platform rollout status deploy/control-plane --timeout=300s

      # dex first: the two OAuth server variants cannot complete auth.FromEnv
      # until the issuer serves its discovery document and key set.
      - name: Wait for dex rollout
        run: kubectl -n dex rollout status deploy/dex --timeout=300s

      # Deliberately no wait for deploy/homelab-k3s-mcp-no-auth: that variant is
      # configured with no credential path at all and is *supposed* to crashloop
      # (platform-auth-safety/AC8 (d) asserts exactly that). Waiting on it would
      # block CI on a pod that must never become Available.
      - name: Wait for OAuth variant rollouts
        run: |
          kubectl -n homelab-k3s-mcp-oauth rollout status deploy/homelab-k3s-mcp-oauth --timeout=300s
          kubectl -n homelab-k3s-mcp-oauth rollout status deploy/homelab-k3s-mcp-oauth-only --timeout=300s

      # 파일별 스텝을 나열하지 않는다. tests/integration/run_all.py 가 매칭 단위 파일을
      # 자동 발견해 각 파일이 모듈 docstring에 신고한 `실행 대상`(primary / auth-variant)
      # 별로 실행하므로, AC를 전용 파일로 쪼갤 때 이 워크플로를 고칠 필요가 없다.
      # 배차 누락(= 만들어 놓고 실행되지 않는 파일)은 lint 잡의 check_ac_mapping.py 가 막는다.
      #
      # 포트포워드는 그룹 하나가 여러 파일을 도는 동안 살아 있어야 하므로 재시도 루프로
      # 띄운다. 끊겨도 곧바로 되살아나고, 각 테스트 파일이 시작할 때 healthz 를 기다린다.
      - name: Run integration tests (primary deployment)
        run: |
          ( while true; do kubectl -n homelab-k3s-mcp port-forward svc/homelab-k3s-mcp 8080:80 >>/tmp/pf-primary.log 2>&1; sleep 1; done ) &
          PF_PID=$!
          ( while true; do kubectl -n http-trace port-forward svc/http-trace 8090:8081 >>/tmp/pf-trace.log 2>&1; sleep 1; done ) &
          TRACE_PID=$!
          trap 'kill $PF_PID $TRACE_PID 2>/dev/null || true; pkill -f "port-forward svc/homelab-k3s-mcp" || true; pkill -f "port-forward svc/http-trace" || true' EXIT
          python tests/integration/run_all.py --group primary \
            --base-url http://127.0.0.1:8080 --trace-url http://127.0.0.1:8090

      # 인증을 켜고 자격증명 시크릿을 하나도 붙이지 않은 배포 변형
      # (tests/k8s/kind/auth-fixture.yaml). 인증 게이트와 "미설정 시 graceful 거부" 는
      # 이 배포에서만 관측된다.
      - name: Run integration tests (auth-variant deployment)
        run: |
          ( while true; do kubectl -n homelab-k3s-mcp-auth port-forward svc/homelab-k3s-mcp-auth 8088:80 >>/tmp/pf-auth.log 2>&1; sleep 1; done ) &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true; pkill -f "port-forward svc/homelab-k3s-mcp-auth" || true' EXIT
          python tests/integration/run_all.py --group auth-variant --base-url http://127.0.0.1:8088

      # 실 OIDC 발급자(dex)를 가리키도록 MCP_OAUTH_* 를 세팅한 배포 변형
      # (tests/k8s/kind/oidc-fixture.yaml). 디스커버리 라우트는 OAuth 가 구성된 경우에만
      # 걸리므로 platform-auth-safety/AC2 는 이 배포에서만 관측된다.
      - name: Run integration tests (oauth-variant deployment)
        run: |
          ( while true; do kubectl -n homelab-k3s-mcp-oauth port-forward svc/homelab-k3s-mcp-oauth 8089:80 >>/tmp/pf-oauth.log 2>&1; sleep 1; done ) &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true; pkill -f "port-forward svc/homelab-k3s-mcp-oauth" || true' EXIT
          python tests/integration/run_all.py --group oauth-variant --base-url http://127.0.0.1:8089

      # 실물 gatekeeper 를 기록 프록시 뒤에 둔 배포 변형(tests/k8s/kind/gatekeeper-variant.yaml).
      # 승인 게이트의 요청 본문 계약(AC2)·만료 관측(AC4 (b))·자동 응답 모드(AC9)는
      # 이 배포에서만 관측된다.
      - name: Run integration tests (gatekeeper-variant deployment)
        run: |
          ( while true; do kubectl -n homelab-k3s-mcp-gatekeeper-variant port-forward svc/homelab-k3s-mcp-gatekeeper-variant 8092:80 >>/tmp/pf-gatekeeper.log 2>&1; sleep 1; done ) &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true; pkill -f "port-forward svc/homelab-k3s-mcp-gatekeeper-variant" || true' EXIT
          python tests/integration/run_all.py --group gatekeeper-variant --base-url http://127.0.0.1:8092

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl -n homelab-k3s-mcp get all -o wide || true
          kubectl -n homelab-k3s-mcp describe deploy/homelab-k3s-mcp || true
          kubectl -n homelab-k3s-mcp logs deploy/homelab-k3s-mcp --tail=200 || true
          kubectl -n workload-test get all -o wide || true
          kubectl -n workload-test describe deploy/workload-fixture || true
          kubectl -n dear-baby-test get all -o wide || true
          kubectl -n dear-baby-test describe deploy/dear-baby-fixture || true
          kubectl -n dear-baby-test logs deploy/dear-baby-fixture --tail=200 || true
          kubectl -n gatekeeper get all -o wide || true
          kubectl -n gatekeeper describe deploy/gatekeeper || true
          kubectl -n gatekeeper logs deploy/gatekeeper --tail=200 || true
          kubectl -n homelab-k3s-mcp-gatekeeper-variant get all -o wide || true
          kubectl -n homelab-k3s-mcp-gatekeeper-variant logs deploy/homelab-k3s-mcp-gatekeeper-variant --tail=200 || true
          kubectl -n github-mock get all -o wide || true
          kubectl -n github-mock describe deploy/github-mock || true
          kubectl -n github-mock logs deploy/github-mock --tail=200 || true
          kubectl -n minio get all -o wide || true
          kubectl -n minio describe deploy/minio || true
          kubectl -n minio logs deploy/minio --tail=200 || true
          kubectl -n minio logs job/minio-seed --tail=200 || true
          kubectl -n grafana-mock get all -o wide || true
          kubectl -n grafana-mock describe deploy/grafana-mock || true
          kubectl -n grafana-mock logs deploy/grafana-mock --tail=200 || true
          kubectl -n opensearch get all -o wide || true
          kubectl -n opensearch describe deploy/opensearch || true
          kubectl -n opensearch logs deploy/opensearch --tail=200 || true
          kubectl -n http-trace get all -o wide || true
          kubectl -n http-trace describe deploy/http-trace || true
          kubectl -n http-trace logs deploy/http-trace --tail=200 || true
          kubectl -n homelab-k3s-mcp-auth get all -o wide || true
          kubectl -n homelab-k3s-mcp-auth describe deploy/homelab-k3s-mcp-auth || true
          kubectl -n homelab-k3s-mcp-auth logs deploy/homelab-k3s-mcp-auth --tail=200 || true
          kubectl -n session-platform get all -o wide || true
          kubectl -n session-platform describe deploy/control-plane || true
          kubectl -n session-platform logs deploy/control-plane --tail=200 || true
          kubectl -n session-platform get configmaps --show-labels || true
          # Session pods the control plane provisioned for session-read/AC1 and
          # session-write/AC1. A pod that never went Ready fails inside the
          # control plane's create call, so its events are where the reason is.
          kubectl -n session-platform get pods -l session-platform.dev/pod-role=workload -o wide || true
          kubectl -n session-platform describe pods -l session-platform.dev/pod-role=workload || true
          kubectl -n session-platform logs -l session-platform.dev/pod-role=workload --tail=200 || true
          kubectl -n dex get all -o wide || true
          kubectl -n dex describe deploy/dex || true
          kubectl -n dex logs deploy/dex --tail=200 || true
          kubectl -n homelab-k3s-mcp-oauth get all -o wide || true
          kubectl -n homelab-k3s-mcp-oauth describe deploy/homelab-k3s-mcp-oauth || true
          kubectl -n homelab-k3s-mcp-oauth logs deploy/homelab-k3s-mcp-oauth --tail=200 || true
          kubectl -n homelab-k3s-mcp-oauth describe deploy/homelab-k3s-mcp-oauth-only || true
          kubectl -n homelab-k3s-mcp-oauth logs deploy/homelab-k3s-mcp-oauth-only --tail=200 || true
          # 기동 실패가 의도인 변형(AC8 (d)). 현재 인스턴스에 로그가 없으면 직전 것을 본다.
          kubectl -n homelab-k3s-mcp-oauth describe deploy/homelab-k3s-mcp-no-auth || true
          kubectl -n homelab-k3s-mcp-oauth logs -l app.kubernetes.io/name=homelab-k3s-mcp-no-auth --tail=200 || true
          kubectl -n homelab-k3s-mcp-oauth logs -l app.kubernetes.io/name=homelab-k3s-mcp-no-auth --tail=200 --previous || true
