name: Build and Push Docker Image to GHCR

# 런타임 이미지를 GitHub Container Registry 에 **커밋 SHA 태그 하나로만** 발행하고,
# main 푸시에서는 그 SHA 로 k8s/deployment.yaml 을 고친 커밋을 `deploy` 브랜치로
# 발행해 운영이 가리키는 이미지를 고정한다(`pin` job). Flux 는 main 이 아니라 deploy 를
# 추적한다 — main 은 ruleset 으로 보호되어 봇이 되커밋할 수 없다.
#
#   ghcr.io/dlddu/homelab-k3s-mcp:<sha>
#
# `latest` 는 더 이상 만들지 않는다. 만들면 안 되는 쪽에 가깝다 — 이 워크플로 이전의
# ci.yml `docker` 잡은 브랜치 조건이 없어 **PR 빌드도 `latest` 를 덮어썼고**, 운영
# Deployment 가 그 `:latest` 를 가리키고 있었다. 즉 머지되지 않은 코드가 다음 pull 에
# 운영으로 들어갈 수 있었고, 실제로 발행된 `latest` 의 digest 는 main HEAD 의 SHA 태그와
# 달랐다. 이제 운영이 어느 커밋을 돌리는지는 deploy 브랜치의 k8s/deployment.yaml(과 그 끝
# 커밋의 Source-Commit 트레일러)만 보면 되고,
# PR 프리뷰 환경(flux-cd-apps 의 apps/homelab-k3s-mcp-preview)은 같은 규칙으로 PR head
# SHA 태그를 그대로 가져다 쓴다. 태그가 불변이므로 imagePullPolicy 도 기본값
# (IfNotPresent)이 그대로 옳다.
#
# ci.yml 의 통합 테스트는 검증용으로 이미지를 *빌드만* 한다(kind 에 load 한다).
# 실제로 pull 가능한 태그를 발행하는 것은 이 워크플로다.
#
# PR 경로(workflow_call)에 경로 필터를 두지 않는 것은 의도적이다: 프리뷰는 PR head SHA
# 태그를 참조하므로, 문서만 고친 PR 에 `deploy/preview` 라벨이 붙어도 그 SHA 에 이미지가
# 있어야 환경이 뜬다. 소스가 그대로면 buildx 의 gha 캐시가 통째로 히트하니 비용은 크지 않다.
#
# main push 에는 경로 조건을 건다. 서버 바이너리(Go 소스)와 운영 매니페스트(k8s/)에 닿지
# 않는 머지는 새 SHA 태그만 만들어 운영 파드를 재시작시킬 뿐이라 건너뛴다. 건너뛴 커밋은
# deploy 브랜치에 반영되지 않는다 — 운영 커밋은 deploy 끝 커밋의 Source-Commit 트레일러가
# 말한다. 제외 목록 방식이라 새 디렉터리는 기본으로 돈다. 제외를 늘리려면 바이너리(go:embed
# 포함)와 Flux 가 그 경로를 읽지 않는지 먼저 확인할 것.

# 트리거: main push 는 여기서 단독으로 받는다(발행 + pin, 테스트는 PR 에서 이미 통과).
# PR 은 ci.yml 의 `image` 잡이 workflow_call 로 부르므로 발행 실패가 단일 필수 체크
# `ci passed` 를 실패시킨다. 호출된 워크플로도 호출자의 github 컨텍스트를 보므로 아래
# event/ref 조건은 어느 쪽이든 똑같이 동작한다. workflow_dispatch 는 단독 실행용이다.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.dockerignore'
      - '!docs/**'
      - '!scripts/**'
      - '!tests/**'
      - '!**/*.md'
      - '!**/*_test.go'
      - '!.gitignore'
      - '!.github/**'
      - '.github/workflows/docker-build-push.yaml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: build & push server image
    runs-on: ubuntu-24.04-arm
    steps:
      # PR 에서는 기본값이 refs/pull/N/merge(임시 머지 커밋)라 이미지 내용이
      # 태그(head SHA)와 어긋난다. 태그가 가리키는 커밋을 그대로 빌드한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/dlddu/homelab-k3s-mcp:${{ github.event.pull_request.head.sha || github.sha }}
          labels: |
            org.opencontainers.image.title=homelab-k3s-mcp
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          # 단일 플랫폼 이미지를 그대로 발행한다. provenance 를 켜면 manifest list 가
          # 붙어 kind 의 `kind load docker-image` 와 arm64 노드의 pull 경로가 갈린다.
          provenance: false

  pin:
    name: pin deployment image (main only)
    needs: [build-and-push]
    # main 푸시에서만. PR 빌드는 이미지를 <head sha> 로 올려두기만 하고
    # (프리뷰 환경이 그 태그를 쓴다) 운영 매니페스트는 건드리지 않는다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      # 이 job 만 deploy 브랜치에 push 한다. 워크플로 전체 기본값은 contents: read 유지.
      contents: write
    steps:
      # main 의 HEAD 가 아니라 방금 빌드한 커밋 그대로를 deploy 의 부모로 삼는다.
      # 전체 히스토리는 아래 「더 새 커밋이 이미 발행됐는가」 조상 판정에 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin k8s/deployment.yaml image to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          f=k8s/deployment.yaml

          sed -i -E "s#(ghcr\.io/dlddu/homelab-k3s-mcp):[A-Za-z0-9._-]+#\1:${SHA}#g" "$f"

          # sed 가 조용히 빗나가지 않았는지 확인한다. 개수를 못박는 대신 "고정되지 않은
          # 참조가 하나도 남지 않았다"를 본다 — 두 번째 참조가 생겨도 이 검사가 잡는다.
          leftover=$(grep -oE "ghcr\.io/dlddu/homelab-k3s-mcp:[A-Za-z0-9._-]+" "$f" \
                       | grep -v ":${SHA}\$" || true)
          if [ -n "$leftover" ]; then
            echo "::error::$f: 고정되지 않은 이미지 참조가 남았습니다:"
            echo "$leftover"
            exit 1
          fi
          # 최소 한 곳은 실제로 고정되어 있어야 한다(파일이 통째로 바뀐 경우 방어).
          n=$(grep -cE "ghcr\.io/dlddu/homelab-k3s-mcp:${SHA}" "$f" || true)
          [ "$n" -ge 1 ] || { echo "::error::$f: 고정된 참조가 없습니다"; exit 1; }

          # ── deploy 브랜치로 발행 ─────────────────────────────────────────────
          # main 은 ruleset(required status check)으로 보호되어 봇이 직접 커밋할 수 없고,
          # 그러려고 장기 크레덴셜(App 키)을 두지도 않는다. 대신 「main@SHA + 고정 커밋
          # 하나」를 deploy 브랜치로 force-push 하고, Flux 는 deploy 를 추적한다.
          # 기본 GITHUB_TOKEN 의 push 는 새 워크플로를 트리거하지 않고, 어떤 워크플로도
          # deploy 푸시에 걸려 있지 않으므로 재귀가 없다.
          git fetch --no-tags origin +refs/heads/deploy:refs/remotes/origin/deploy 2>/dev/null || true
          old=$(git rev-parse -q --verify refs/remotes/origin/deploy || true)

          # 늦게 끝난 옛 실행이 더 새 배포를 덮지 않게 한다. deploy 끝 커밋의
          # Source-Commit 트레일러가 이 SHA 의 후손이면 이미 앞서 있으니 건너뛴다.
          # (롤백은 main 에 revert PR 을 올리는 것 — 그 머지가 새 SHA 로 다시 여기를 탄다.)
          if [ -n "$old" ]; then
            cur=$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' "$old" | tr -d '[:space:]')
            if [ -n "$cur" ] && [ "$cur" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$cur" 2>/dev/null; then
              echo "deploy 는 이미 더 새로운 main 커밋(${cur})을 가리킨다 — 건너뜀."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -a --allow-empty \
            -m "deploy: homelab-k3s-mcp 이미지를 ${SHA} 로 고정" \
            -m "Source-Commit: ${SHA}"

          # lease 로 「읽은 뒤 누가 먼저 밀었으면」 실패시킨다(old 가 비면 = 브랜치가 없어야 함).
          git push --force-with-lease="refs/heads/deploy:${old}" origin HEAD:refs/heads/deploy
