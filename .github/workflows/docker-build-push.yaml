name: Build and Push Docker Image to GHCR

# 런타임 이미지를 GitHub Container Registry 에 **커밋 SHA 태그 하나로만** 발행하고,
# main 푸시에서는 그 SHA 를 k8s/deployment.yaml 에 되커밋해 운영이 가리키는 이미지를
# 고정한다(`pin` job).
#
#   ghcr.io/dlddu/homelab-k3s-mcp:<sha>
#
# `latest` 는 더 이상 만들지 않는다. 만들면 안 되는 쪽에 가깝다 — 이 워크플로 이전의
# ci.yml `docker` 잡은 브랜치 조건이 없어 **PR 빌드도 `latest` 를 덮어썼고**, 운영
# Deployment 가 그 `:latest` 를 가리키고 있었다. 즉 머지되지 않은 코드가 다음 pull 에
# 운영으로 들어갈 수 있었고, 실제로 발행된 `latest` 의 digest 는 main HEAD 의 SHA 태그와
# 달랐다. 이제 운영이 어느 커밋을 돌리는지는 k8s/deployment.yaml 한 곳만 보면 되고,
# PR 프리뷰 환경(flux-cd-apps 의 apps/homelab-k3s-mcp-preview)은 같은 규칙으로 PR head
# SHA 태그를 그대로 가져다 쓴다. 태그가 불변이므로 imagePullPolicy 도 기본값
# (IfNotPresent)이 그대로 옳다.
#
# ci.yml 은 검증용으로 이미지를 *빌드만* 한다(kind 에 load 해 통합 테스트를 돌린다).
# 실제로 pull 가능한 태그를 발행하는 것은 이 워크플로다.
#
# 경로 필터를 두지 않는 것은 의도적이다: 프리뷰는 PR head SHA 태그를 참조하므로,
# 문서만 고친 PR 에 `deploy/preview` 라벨이 붙어도 그 SHA 에 이미지가 있어야 환경이 뜬다.
# 소스가 그대로면 buildx 의 gha 캐시가 통째로 히트하니 비용은 크지 않다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: build & push server image
    runs-on: ubuntu-24.04-arm
    steps:
      # PR 에서는 기본값이 refs/pull/N/merge(임시 머지 커밋)라 이미지 내용이
      # 태그(head SHA)와 어긋난다. 태그가 가리키는 커밋을 그대로 빌드한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/dlddu/homelab-k3s-mcp:${{ github.event.pull_request.head.sha || github.sha }}
          labels: |
            org.opencontainers.image.title=homelab-k3s-mcp
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          # 단일 플랫폼 이미지를 그대로 발행한다. provenance 를 켜면 manifest list 가
          # 붙어 kind 의 `kind load docker-image` 와 arm64 노드의 pull 경로가 갈린다.
          provenance: false

  pin:
    name: pin deployment image (main only)
    needs: [build-and-push]
    # main 푸시에서만. PR 빌드는 이미지를 <head sha> 로 올려두기만 하고
    # (프리뷰 환경이 그 태그를 쓴다) 운영 매니페스트는 건드리지 않는다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      # 이 job 만 main 에 커밋한다. 워크플로 전체 기본값은 contents: read 유지.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin k8s/deployment.yaml image to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          f=k8s/deployment.yaml

          sed -i -E "s#(ghcr\.io/dlddu/homelab-k3s-mcp):[A-Za-z0-9._-]+#\1:${SHA}#g" "$f"

          # sed 가 조용히 빗나가지 않았는지 확인한다. 개수를 못박는 대신 "고정되지 않은
          # 참조가 하나도 남지 않았다"를 본다 — 두 번째 참조가 생겨도 이 검사가 잡는다.
          leftover=$(grep -oE "ghcr\.io/dlddu/homelab-k3s-mcp:[A-Za-z0-9._-]+" "$f" \
                       | grep -v ":${SHA}\$" || true)
          if [ -n "$leftover" ]; then
            echo "::error::$f: 고정되지 않은 이미지 참조가 남았습니다:"
            echo "$leftover"
            exit 1
          fi
          # 최소 한 곳은 실제로 고정되어 있어야 한다(파일이 통째로 바뀐 경우 방어).
          n=$(grep -cE "ghcr\.io/dlddu/homelab-k3s-mcp:${SHA}" "$f" || true)
          [ "$n" -ge 1 ] || { echo "::error::$f: 고정된 참조가 없습니다"; exit 1; }

          if git diff --quiet; then
            echo "이미 ${SHA} 로 고정되어 있음 — 커밋할 것 없음(재실행)."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(deploy): homelab-k3s-mcp 이미지를 ${SHA} 로 고정 [skip ci]"

          # 이 push 는 기본 GITHUB_TOKEN 으로 나가므로 새 워크플로 실행을 트리거하지
          # 않는다(GitHub 문서화된 동작). 나중에 PAT/App 토큰으로 바꾸더라도 커밋
          # 메시지의 [skip ci] 가 재귀를 한 번 더 막는다.
          # 머지가 연달아 들어와 main 이 앞서 있으면 rebase 후 재시도.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
